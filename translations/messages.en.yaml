    ago: 'ago'
    config_backup:
        change:
            absent: 'nothing set here yet'
            differs: 'replaces a different value'
            unchanged: 'already identical'
        disposition:
            applied: 'Written, and in force now.'
            applied-on-restart: 'takes effect on next restart'
            external: >-
                plMail is a client of the system this belongs to, not its owner. The
                database role was created with the password Postgres already holds, and
                only an initdb reads a new one — so changing it here alone gives you an
                installation that cannot connect to its own database. Change it in Postgres
                first, then here.
            kept-deliberately: >-
                Kept as it is here, on purpose. The credentials out of this backup were
                re-encrypted with this installation's key as they were written, so putting
                the backup's key in place would make them — and everything else already
                stored — unreadable at the next start. The line below is only for the case
                where you are also restoring the old database, whose rows are encrypted
                with it; then it has to go in before anything is stored.
            not-writable: >-
                This process could not write that path. Read-only secrets volume, wrong
                uid, or a service that was never given the volume. The value is in the
                backup you just uploaded — put it there yourself.
            shadowed-by-compose: >-
                Written, but something in the process environment sets this name too, and
                the entrypoint lets an explicitly configured value win over the generated
                one. Remove or update it in your compose file — or in the `.env` beside it
                — and restart; the restored value is already waiting underneath.
        error:
            malformed-document: >-
                The password opened that file, but what is inside is not a configuration
                backup this plMail can read. Nothing has been changed.
            not-a-backup: >-
                That is not a plMail configuration backup. Nothing has been changed.
            unsupported-version: >-
                That backup was written by a newer plMail than this one, in a format this
                version cannot read. Upgrade first, then import it.
            wrong-password: >-
                That password does not open this file — or the file has been altered since
                it was written. Nothing has been changed.
        export:
            error:
                mismatch: 'The two passwords did not match, so nothing was exported.'
                too_short: 'That password is too short, so nothing was exported.'
            heading: 'Export configuration'
            intro: >-
                Every setting and credential this installation runs on, in one
                password-encrypted file: the environment values, the files in the secrets
                volume, the provider and Firebase credentials from the database, and the
                people — each with their password, their second factor, their mailboxes
                and everything else they configured. No mail, no calendar entries and no
                contacts; those are what `app:backup` is for.
            generate: 'Generate one'
            generated_copied: 'Copied to your clipboard — store it somewhere that outlives this machine.'
            generated_shown: 'Your browser would not share its clipboard, so the password is shown above — store it now.'
            password: 'Password'
            password_help: >-
                At least %length% characters. It is never stored anywhere, and there is no
                way to open the file without it.
            password_repeat: 'Repeat password'
            submit: 'Download backup'
            warning: >-
                The file that comes out is every secret this installation has, protected by
                nothing but the password you type here. Keep it the way you would keep the
                encryption key itself.
        import:
            error:
                no_file: 'No file arrived, or it was far larger than a configuration backup can be.'
                no_password: 'Enter the password this backup was sealed with.'
            file: 'Backup file'
            heading: 'Import configuration'
            intro: >-
                Upload a backup and enter its password. Nothing is written until you have
                seen what it would do and confirmed it.
            password: 'Password'
            submit: 'Review this backup'
        review:
            already_matching: '%count% more already match this environment, so there is nothing to do about them.'
            apply: 'Apply this backup'
            applied: 'What was written'
            confirm_password: 'Password, once more'
            exported_at: 'Exported'
            from: 'From'
            heading: 'Review this backup'
            instructed: 'These are yours to do'
            instructed_lead: >-
                Everything else is in place. These few cannot be finished from here, and
                each one says why — saying otherwise would be a lie an operator only
                discovers on the day it matters.
            kept_users: 'Already here — kept as they are'
            kept_users_lead: >-
                This installation already has these people, matched by email address.
                Nothing about them was touched: not their password, not their second
                factor, not their mailboxes or anything else they had set up. A backup is
                a photograph of a moment that has passed, and writing it over a live
                account is how somebody is locked out of their own mail without a word
                anywhere.
            notes: 'Worth knowing'
            old_key_summary: 'Also restoring the old database? You will need its old encryption key.'
            restart: >-
                Most of this is read when the stack starts, so plMail writes it into the
                generated secrets and it takes effect on the next restart. That is one
                restart for the whole list, not one per value.
            restart_applied: >-
                Written. The values read at container start are in place but not yet in
                force — restart the stack once and this installation comes up as the one
                the backup was made from.
            unknown_instance: 'not recorded'
            written: 'plMail writes these'
            written_applied: 'Written'
            written_none: 'There is nothing in this backup for plMail to write.'
        section:
            database: 'Database'
            env: 'Environment variables'
            files: 'Files in the secrets volume'
            users: 'People and everything they set up'
