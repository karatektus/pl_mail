        inherited: 'Credentials copied'
        mail:
            calendar_heading: 'Calendar sync uses this same app'
            calendar_google: >-
                Nothing to set up here. Enable the Google Calendar API for this
                project and add the .../auth/calendar scope to the consent
                screen — users then get their calendars with the same sign-in
                they already use for mail. Without it, mail keeps working and
                calendars simply do not appear.
            calendar_microsoft: >-
                Nothing to set up here. Add the Calendars.ReadWrite delegated
                permission to this app registration — users then get their
                calendars with the same sign-in they already use for mail.
                Without it, mail keeps working and calendars simply do not
                appear.
            env_note: 'Leaving these empty falls back to GOOGLE_OAUTH_* / MICROSOFT_OAUTH_* in the environment, so an installation already configured that way keeps working.'
            from_env: 'From environment'
            google: 'Gmail sign-in'
            heading: 'Mail sign-in'
            intro: 'The OAuth app users sign in through when they add a mail account. Google and Microsoft file integrations can reuse the same credentials.'
            microsoft: 'Microsoft mail sign-in'
            saved: 'Mail sign-in saved'
        intro: 'Services users can attach files from and save attachments to. Every service is listed here, including the ones plMail cannot talk to yet.'
        not_set: 'Not set'
        saved: 'Integration settings saved'
        secret_none: 'No secret stored'
        secret_stored: 'Stored'
        secret_unchanged: 'Leave blank to keep the stored secret'
        status:
            disabled: 'Disabled'
            enabled: 'Enabled'
            incomplete: 'Needs credentials'
            unimplemented: 'Not available yet'
        tutorial:
            caldav:
                intro: 'CalDAV authenticates with a per-user app password against the user''s own server, so there is nothing to register here.'
                not_for_cloud_mail: 'Gmail and Outlook calendars do not come in this way. They ride the mail sign-in above, and need only the calendar permission ticked on that app registration.'
                security: 'Users should create an app-specific password rather than use their login password: app passwords are individually revocable and work with two-factor authentication. iCloud and Fastmail accept nothing else.'
                step_app_password: 'Each user creates an app password on their own server — Nextcloud under Settings → Security, iCloud at appleid.apple.com, Fastmail under Settings → Password & Security — and pastes it into their own calendar settings.'
                step_base_url: 'Optionally pin the server address, for example https://cloud.example.com, if everyone here uses the same server.'
                step_enable: 'Turn on "Offer this service to users" above.'
                step_url: 'The address to enter is the CalDAV one, not the web interface: Nextcloud shows it under Calendar → Settings → "Copy primary CalDAV address", and it usually ends in /remote.php/dav. A bare domain works too — plMail asks it where its calendars live.'
            dropbox:
                intro: 'Dropbox needs an app registered in the Dropbox developer console.'
                refresh_note: 'Choose the scoped access app type and request offline access, or connections will stop working after a few hours.'
                step_app: 'Create an app at dropbox.com/developers/apps with scoped access to the full Dropbox.'
                step_paste: 'Copy the app key and app secret into the fields above.'
                step_permissions: 'Under Permissions, enable files.metadata.read, files.content.read and files.content.write.'
                step_redirect: 'Under Settings, add the redirect URI shown above to the OAuth 2 redirect URIs.'
            google:
                separate_from_gmail: 'These credentials are separate from the Gmail ones in your environment file. You may reuse the same Cloud project, but the consent screen must list the extra scopes.'
                step_consent: 'Configure the OAuth consent screen and add the scopes listed below.'
                step_credentials: 'Create an OAuth 2.0 Client ID of type Web application.'
                step_paste: 'Copy the client ID and client secret into the fields above.'
                step_project: 'Open console.cloud.google.com and select or create a project.'
                step_redirect: 'Add the redirect URI shown above to the authorised redirect URIs.'
            google_drive:
                intro: 'Google Drive uses OAuth, so plMail must be registered with Google before anyone can connect.'
                scopes: 'Scope needed: the full drive scope. drive.file would be narrower, but it only ever sees files plMail itself created, so a browser would show an empty Drive — and share links need write access to the file being shared. This is a restricted scope: Google requires app verification before users outside your test list can consent.'
                step_api: 'Enable the Google Drive API for the project.'
            google_photos:
                intro: 'Google Photos uses OAuth and its own API, separate from Drive.'
                scope_warning: 'Google restricted the Photos read scopes in March 2025. A newly registered app is generally granted only appcreateddata, which sees nothing but media plMail itself uploaded — browsing an existing library needs the photoslibrary.readonly scope, which Google grants case by case. Saving attachments to Photos works either way; browsing may show an empty library until that scope is approved.'
                step_api: 'Enable the Photos Library API for the project.'
            immich:
                intro: 'Immich authenticates with a per-user API key, so there is nothing to register here.'
                no_share_links: 'Immich cannot create a public link for a single photo — sharing is album-level. Photos above the attachment size limit therefore cannot be attached at all.'
                step_base_url: 'Optionally pin the server address, for example https://photos.example.com.'
                step_enable: 'Turn on "Offer this service to users" above.'
                step_key: 'Each user generates an API key in Immich under Account Settings → API Keys and pastes it into their own integration settings.'
            nextcloud:
                intro: 'Nextcloud authenticates with a per-user app password, so there is nothing to register here.'
                security: 'Users should create an app password, not use their login password: app passwords are individually revocable and work with two-factor authentication.'
                step_base_url: 'Optionally pin the server address, for example https://cloud.example.com.'
                step_enable: 'Turn on "Offer this service to users" above.'
                step_user: 'Each user creates an app password in Nextcloud under Settings → Security → Devices & sessions and pastes it into their own integration settings.'
            one_drive:
                intro: 'OneDrive uses Microsoft Graph, the same API as Microsoft mail accounts, but needs Files permissions that the mail registration does not grant.'
                step_paste: 'Copy the application (client) ID and the secret value into the fields above.'
                step_permissions: 'Under API permissions, add the delegated Microsoft Graph permissions Files.ReadWrite and offline_access.'
                step_redirect: 'Under Authentication, add the redirect URI shown above as a Web platform redirect.'
                step_register: 'Open the Azure portal and register an application under Microsoft Entra ID → App registrations.'
                step_secret: 'Under Certificates & secrets, create a client secret and copy its value immediately — it is shown only once.'
                tenant_note: 'Use the common tenant for personal Microsoft accounts, or your tenant ID to restrict access to your organisation.'
        tutorial_heading: 'Setup'
        unimplemented_notice: 'plMail cannot talk to this service yet. You can register the credentials now — they will be used as soon as support ships.'
