onboarding:
    action:
        back: Back
        finish: Finish
        next: Next
        skip: Skip this step
        skip_all: Skip setup
    done:
        body: >-
            Anything you skipped is in Settings, and you can run this again from the
            user menu whenever you like.
        cta: Go to my mail
        heading: You're all set
    aside:
        account:
            body: >-
                plMail needs the incoming (IMAP) and outgoing (SMTP) server addresses for
                your provider. They are usually on your provider's help pages under
                "IMAP settings".
            heading: Where do I find these?
            oauth: >-
                For Gmail and Outlook, use the sign-in buttons under Settings → Mail
                accounts instead — no server addresses needed.
        admin_integrations:
            body: Register plMail with the service, then paste the credentials it gives you.
            heading: Setting this up
        admin_mail:
            google:
                heading: Setting up Gmail sign-in
                step1: Open console.cloud.google.com and create a project, or pick an existing one.
                step2: 'Under APIs & Services → Library, enable the Gmail API.'
                step3: 'Under OAuth consent screen, choose Internal if you have Workspace, otherwise External, and fill in the app name and support email.'
                step4: 'Under Credentials, create an OAuth client ID of type "Web application".'
                step5: Paste the redirect URI below into its "Authorised redirect URIs", then save.
                step6: Copy the client ID and client secret it shows you into the fields on the left.
            microsoft:
                heading: Setting up Microsoft sign-in
                step1: 'Open portal.azure.com and go to Microsoft Entra ID → App registrations → New registration.'
                step2: 'Choose who can sign in. "Accounts in any organizational directory and personal Microsoft accounts" matches the default tenant setting of "common".'
                step3: 'Set the redirect URI to Web, and paste the address below into it.'
                step4: 'After registering, copy the Application (client) ID into the field on the left.'
                step5: 'Under Certificates & secrets, create a new client secret and copy its Value — not its ID — straight away; it is only shown once.'
                step6: 'Under API permissions, add the delegated Microsoft Graph permissions Mail.ReadWrite, Mail.Send and offline_access.'
        profile:
            body: This is what recipients see in the From line. You can change it any time.
            heading: Where this shows up
        security:
            body: >-
                Think about what happens if someone gets your email password. They
                don't just read your mail — they click "forgot password" on your
                bank, your domain registrar, your cloud storage, and collect the
                reset links as they arrive.
            body_two: >-
                A second factor is a code from your phone that changes every 30
                seconds. A stolen password on its own stops being enough.
            heading: Why this one matters most
    account:
        add: Add this account
        or_manual: 'Or set it up by hand:'
        sign_in_with: 'Sign in with %provider%'
        add_another: Add another account
        cancel: Cancel
    integrations:
        cancel: Cancel
        connect: Connect
        connected: Connected
    progress: 'Step %index% of %total%'
    security:
        body: >-
            Your mailbox is the key to every other account you have, because that
            is where password resets arrive. Adding a code from your phone means a
            stolen password is not enough on its own.
        done_body: >-
            You will be asked for a code from your app when you sign in. Keep the
            recovery codes somewhere you can reach without your phone.
        done_heading: Two-factor authentication is on
        skip_hint: You can set this up later under Settings → Security.
    switch_blocked: Nothing was switched — fix the fields below first, and what you entered will be kept.
    step:
        account:
            lead: Connect the mailbox you actually read, and plMail starts syncing it.
            title: Mail account
        admin-integrations:
            lead: Credentials for the services everyone here can attach files from.
            title: Integration credentials
        admin-mail:
            lead: Sign-in credentials for Gmail and Outlook, set once for this whole install.
            title: Mail providers
        appearance:
            lead: How plMail looks. None of this is permanent — change it whenever.
            title: Appearance
        integrations:
            lead: Connect the services you keep files and photos in.
            title: Your integrations
        profile:
            lead: The name that appears on the mail you send.
            title: About you
