        flash:
            calendar_resync: >-
                %calendar% has been asked to sync. It is running in the
                background now, and the card below will say how it went.
            push_repair_failed: >-
                Could not re-register instant delivery for %account%. It stays
                on the scheduled check, so your mail keeps arriving. The card
                below shows what is known.
            push_repaired: >-
                Instant delivery re-registered for %account%.
            queue_discarded: 'Discarded %count% abandoned jobs.'
            queue_retried: 'Put %count% abandoned jobs back on the queue.'
        heading: 'Account health'
        healthy:
            body: >-
                Your accounts are signed in, your calendars are syncing and
                nothing is waiting on you. If mail ever stops arriving, Account
                health comes back to the settings list and this page says why.
            title: 'Everything is working'
        issue:
            account_reconnect:
                body: >-
                    New mail has stopped arriving for this account, and so has
                    everything that depends on it — calendar syncing, filters
                    that run on delivery, and sending from this address. The
                    mail already downloaded is safe and still here. This
                    happens when a password is changed, two-factor
                    authentication is switched on, or the sign-in is revoked
                    from the provider's security page.
                title: '%account% needs you to sign in again'
            calendar_sync_failing:
                body: >-
                    This calendar has stopped picking up changes, so it is
                    showing what it knew the last time it worked. Events added
                    or moved elsewhere since then are not here yet, and changes
                    you make here are not being sent out.
                title: '%calendar% has stopped syncing'
            integration_reconnect:
                body: >-
                    Saving attachments to %connection% and attaching files from
                    it will not work until it is connected again. Your mail is
                    unaffected — this is only the link to that service. Nothing
                    stored there has been touched.
                title: '%connection% needs reconnecting'
            push_degraded:
                body: >-
                    The registration is live and has not expired, but mail has
                    arrived that it never announced — so the notifications are
                    being lost somewhere between the provider and this install,
                    not failing to be asked for. For Gmail that points at the
                    Pub/Sub subscription in Google Cloud: check that it still
                    forwards your topic to this address. Your mail keeps
                    arriving on the scheduled check in the meantime, a few
                    minutes later than it should.
                title: 'Instant delivery is registered but not arriving for %account%'
            push_lapsed:
                body: >-
                    The registration expired and was not renewed, so nothing is
                    being pushed at all. Renewal runs once a day on its own; if
                    the last run below was days ago, the scheduled-task worker
                    has stopped and that is the thing to fix, not this account.
                    Your mail keeps arriving on the scheduled check, a few
                    minutes later than it should.
                title: 'Instant delivery expired for %account%'
            queue_work_abandoned:
                body: >-
                    %count% background jobs tried, failed repeatedly, and were
                    set aside so they would stop retrying. This is usually the
                    aftermath of one of the problems above rather than a
                    separate fault — fix that first, then put these back on the
                    queue.
                title: '%count% background jobs were given up on'
        outcome:
            calendar_failed_again: >-
                It failed again. What it said this time is below — the sync ran,
                it just did not work.
            calendar_still_waiting: >-
                The sync was started, but nothing has come back yet. Try again,
                or reload the page to see where it got to.
            calendar_synced: 'Synced. This calendar is up to date again.'
        pending:
            calendar_resync: 'Starting sync…'
            push_resubscribe: 'Turning it back on…'
            queue_discard: 'Discarding…'
            queue_retry: 'Putting them back…'
            reconnect: 'Taking you to %provider%…'
            reconnect_generic: 'Taking you to sign in…'
        repair:
            calendar_resync:
                label: 'Try syncing now'
                promise: >-
                    Asks this calendar to sync again right away, and puts it
                    back on the normal schedule. Nothing on it is deleted.
            integration_reconnect:
                label: 'Reconnect'
                promise: >-
                    Sends you to sign in again, then restores the existing
                    connection. Your filters and saved destinations keep
                    working.
            push_resubscribe:
                label: 'Turn instant delivery back on'
                promise: >-
                    Registers this account for instant delivery again. Your
                    mail keeps arriving either way while this is sorted out.
            queue_discard:
                label: 'Discard them'
                promise: >-
                    Throws the abandoned jobs away without running them. There
                    is no undo, and anything they had not finished stays
                    unfinished.
            queue_retry:
                label: 'Put them back on the queue'
                promise: >-
                    Tries the abandoned jobs once more. Safe to press — any
                    that fail again simply end up back here.
            reconnect:
                label: 'Reconnect this account'
                promise: >-
                    Takes you to sign in again, then puts the new sign-in onto
                    this same account. Your mail, folders, labels, filters,
                    calendars and settings all stay exactly as they are —
                    nothing is downloaded again and nothing is deleted. You
                    must sign in as %account%; if you pick a different address
                    it will be refused rather than swapped in.
        reconnect:
            done: '%account% is connected again. Mail and calendar syncing will catch up over the next few minutes.'
            wrong_account: >-
                That signed you in as %actual%, but this account is %expected%.
                Nothing has been changed. Sign out of %actual% with that
                provider, then try again — swapping the address would have
                mixed a different mailbox into this one.
        subheading: >-
            Anything that has stopped working, what it means for your mail, and
            the smallest thing that fixes it.
