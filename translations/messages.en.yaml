                title: 'Mail, structure and contacts'
            full:
                button: 'Erase this install'
                deletes: >-
                    Everything, not just synced mail: every user (you included), every account
                    and its stored password, and the files on disk. The install goes back to
                    asking for its first administrator. You are signed out and cannot sign
                    back in.
                title: 'Full reset'
            full_secrets:
                button: 'Erase this install and rotate secrets'
                deletes: >-
                    Everything above, and the generated secrets. Every service is still
                    running with the old APP_ENCRYPTION_KEY in memory and keeps using it
                    until restarted, so anything saved before you restart the stack becomes
                    unreadable to half of it.
                title: 'Full reset and new secrets'
            structure:
                confirm: 'Delete every synced message, thread, folder and label? The next sync rebuilds them.'
                deletes: 'The above, plus the mailbox structure — folders and labels. The next sync rebuilds both.'
                title: 'Mail and mailbox structure'
            synced_mail:
                confirm: 'Delete every synced message and thread? Accounts and folders stay, and the next sync fetches the mail again.'
