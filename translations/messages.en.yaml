settings:
    accounts:
        delete: Remove account
        delete_confirm: 'Remove %account%? This permanently deletes all synced messages for this account and cannot be undone.'
        disable: Disable account
        edit: Edit account
        empty: No accounts yet. Add one to start syncing mail.
        enable: Enable account
        heading: Mail accounts
        label_sync:
            off_hint: >-
                Labels stay local to plMail. Turn this on to mirror new label
                changes to this provider.
            on_hint: >-
                Labels you create, rename or delete are mirrored to this
                provider. Existing labels are left alone.
            title: Sync labels to provider
        password_help: Leave blank to keep the current password.
        primary: Primary
        push:
            degraded_hint: >-
                Push is registered but nothing has arrived recently. The Pub/Sub
                push subscription in Google Cloud may be missing or pointing
                elsewhere. Mail is still syncing on a schedule.
            failed: >-
                Push couldn't be enabled — Microsoft needs to reach this server
                over HTTPS. Check your reverse proxy and APP_PUBLIC_URL. The
                account is still syncing on a schedule.
            health:
                active: Push
                degraded: Push (not delivering)
                inactive: Scheduled
            mode_pull: Scheduled
            mode_push: Push
            not_configured: >-
                Push isn't available on this server — it needs a public HTTPS
                address and, for Gmail, a Cloud Pub/Sub topic.
            off_hint: Mail is checked on a schedule. Turn on push for instant delivery.
            on_hint: New mail arrives immediately via Microsoft push notifications.
            renews: Subscription renews before %date%.
            reregister: Re-register push
            title: Instant delivery
        reorder: Drag to reorder
        status:
            active: Active
            disabled: Disabled
        subheading: Add, edit, enable, or remove the mailboxes you sync.
        sync_limit:
            all: Sync everything
            newest: 'Newest %limit%'
            off_hint: >-
                Every message on the server is synced. On a large mailbox the
                first sync can take hours.
            on_hint: >-
                Only the newest %limit% messages are synced. Raise this later to
                fetch further back; app:reset re-fetches everything.
            title: Messages to sync
        type:
            imap: IMAP
            oauth: '%provider% (OAuth)'
