        monitoring_kept: 'Monitoring data is kept. Clear the aggregated logs from Logs, and stale heartbeats from Maintenance.'
        postgres_password: >-
            POSTGRES_PASSWORD is not rotated. Postgres was initialised with it and keeps
            it in its own data directory, so regenerating it would leave plMail unable to
            log in to the database it just reset. Changing that one means wiping the
            database volume — docker compose down -v — which this cannot do.
        restart_required: 'Restart the whole stack immediately afterwards, and before using plMail:'
        self_restart: 'The web container asks itself to exit once this page has been sent, and compose brings it straight back. The workers are signalled too; the command above covers the rest of the stack.'
        self_restart_unavailable: 'This process cannot restart itself here, so the command above is the only way. Nothing will happen automatically.'
        stage:
            accounts:
                confirm: 'Delete the accounts as well? Every mailbox password and OAuth connection has to be entered again.'
                deletes: 'The above, plus the accounts themselves, aliases included. Every mailbox password and OAuth connection has to be set up from scratch. Your own sign-in is untouched.'
