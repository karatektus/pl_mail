admin:
    accounts:
        account: 'Konto'
        heading: 'Konten'
        last_activity: 'Letzte Aktivität'
        messages: 'Nachrichten'
        threads: 'Konversationen'
    ago: 'her'
    config_backup:
        change:
            absent: 'hier noch nicht gesetzt'
            differs: 'ersetzt einen anderen Wert'
            unchanged: 'bereits identisch'
        disposition:
            applied: 'Geschrieben und ab sofort wirksam.'
            applied-on-restart: 'wirkt nach dem nächsten Neustart'
            external: >-
                plMail ist hier Client des Systems und nicht sein Eigentümer. Die
                Datenbankrolle wurde mit dem Passwort angelegt, das Postgres bereits hält,
                und nur eine Neuinitialisierung liest ein anderes ein — den Wert allein
                hier zu ändern ergibt also eine Installation, die sich nicht mehr mit ihrer
                eigenen Datenbank verbinden kann. Ändere ihn zuerst in Postgres, dann hier.
            kept-deliberately: >-
                Bleibt bewusst so, wie er hier ist. Die Zugangsdaten aus dieser Sicherung
                wurden beim Schreiben mit dem Schlüssel dieser Installation neu
                verschlüsselt; den Schlüssel aus der Sicherung einzusetzen würde sie — und
                alles andere bereits Gespeicherte — beim nächsten Start unlesbar machen.
                Die Zeile unten ist nur für den Fall gedacht, dass du auch die alte
                Datenbank wiederherstellst, deren Zeilen damit verschlüsselt sind; dann
                muss sie eingetragen sein, bevor irgendetwas gespeichert wird.
            not-writable: >-
                Dieser Prozess konnte diesen Pfad nicht schreiben. Schreibgeschütztes
                Secrets-Volume, falsche UID oder ein Dienst, der das Volume nie bekommen
                hat. Der Wert steckt in der Sicherung, die du gerade hochgeladen hast —
                lege ihn selbst dort ab.
            shadowed-by-compose: >-
                Geschrieben, aber dieser Name ist auch in der Prozessumgebung gesetzt, und
                der Entrypoint lässt einen ausdrücklich konfigurierten Wert über den
                erzeugten siegen. Entferne oder aktualisiere ihn in deiner Compose-Datei —
                oder in der `.env` daneben — und starte neu; der wiederhergestellte Wert
                liegt bereits darunter bereit.
        error:
            malformed-document: >-
                Das Passwort hat die Datei geöffnet, aber ihr Inhalt ist keine
                Konfigurationssicherung, die diese plMail-Version lesen kann. Es wurde
                nichts geändert.
            not-a-backup: >-
                Das ist keine plMail-Konfigurationssicherung. Es wurde nichts geändert.
            unsupported-version: >-
                Diese Sicherung stammt aus einer neueren plMail-Version und liegt in einem
                Format vor, das diese Version nicht lesen kann. Aktualisiere zuerst, dann
                importiere sie.
            wrong-password: >-
                Mit diesem Passwort lässt sich die Datei nicht öffnen — oder die Datei
                wurde seit dem Schreiben verändert. Es wurde nichts geändert.
        export:
            error:
                mismatch: 'Die beiden Passwörter stimmten nicht überein, es wurde nichts exportiert.'
                too_short: 'Dieses Passwort ist zu kurz, es wurde nichts exportiert.'
            heading: 'Konfiguration exportieren'
            intro: >-
                Alle Einstellungen und Zugangsdaten, mit denen diese Installation läuft, in
                einer passwortverschlüsselten Datei: die Umgebungswerte, die Dateien im
                Secrets-Volume, die Anbieter- und Firebase-Zugangsdaten aus der Datenbank
                sowie die Personen — jede mit Passwort, zweitem Faktor, Postfächern und
                allem anderen, was sie eingerichtet hat. Keine E-Mails, keine
                Kalendereinträge, keine Kontakte — dafür ist `app:backup` da.
            generate: 'Eins erzeugen'
            generated_copied: 'In die Zwischenablage kopiert — bewahre es an einem Ort auf, der diese Maschine überlebt.'
            generated_shown: 'Dein Browser gibt die Zwischenablage nicht frei, das Passwort steht deshalb oben im Feld — sichere es jetzt.'
            password: 'Passwort'
            password_help: >-
                Mindestens %length% Zeichen. Es wird nirgends gespeichert, und ohne es
                lässt sich die Datei nicht öffnen.
            password_repeat: 'Passwort wiederholen'
            submit: 'Sicherung herunterladen'
            warning: >-
                Die entstehende Datei enthält jedes Geheimnis dieser Installation, geschützt
                durch nichts als das Passwort, das du hier eingibst. Bewahre sie so auf, wie
                du den Verschlüsselungsschlüssel selbst aufbewahren würdest.
        import:
            error:
                no_file: 'Es kam keine Datei an, oder sie war weit größer, als eine Konfigurationssicherung sein kann.'
                no_password: 'Gib das Passwort ein, mit dem diese Sicherung versiegelt wurde.'
            file: 'Sicherungsdatei'
            heading: 'Konfiguration importieren'
            intro: >-
                Lade eine Sicherung hoch und gib ihr Passwort ein. Es wird nichts
                geschrieben, bevor du gesehen und bestätigt hast, was passieren würde.
            password: 'Passwort'
            submit: 'Sicherung prüfen'
        review:
            already_matching: '%count% weitere stimmen bereits mit dieser Umgebung überein, dabei ist also nichts zu tun.'
            apply: 'Diese Sicherung anwenden'
            applied: 'Was geschrieben wurde'
            confirm_password: 'Passwort, noch einmal'
            exported_at: 'Exportiert'
            from: 'Von'
            heading: 'Sicherung prüfen'
            instructed: 'Das musst du selbst erledigen'
            instructed_lead: >-
                Alles Übrige steht bereits. Diese wenigen Punkte lassen sich von hier aus
                nicht abschließen, und jeder sagt warum — etwas anderes zu behaupten wäre
                eine Lüge, die ein Betreiber erst an dem Tag bemerkt, an dem es darauf
                ankommt.
            kept_users: 'Schon vorhanden — unverändert gelassen'
            kept_users_lead: >-
                Diese Personen gibt es in dieser Installation bereits, erkannt an der
                E-Mail-Adresse. An ihnen wurde nichts angerührt: weder Passwort noch
                zweiter Faktor, weder Postfächer noch sonst etwas, das sie eingerichtet
                hatten. Eine Sicherung ist die Momentaufnahme eines vergangenen Zeitpunkts,
                und sie über ein lebendes Konto zu schreiben ist der Weg, auf dem jemand
                ohne ein Wort irgendwo aus seiner eigenen Mail ausgesperrt wird.
            notes: 'Gut zu wissen'
            old_key_summary: 'Spielst du auch die alte Datenbank ein? Dann brauchst du ihren alten Verschlüsselungsschlüssel.'
            restart: >-
                Das meiste davon wird beim Start des Stacks gelesen, deshalb schreibt es
                plMail in die erzeugten Geheimnisse, und es wirkt ab dem nächsten Neustart.
                Das ist ein Neustart für die ganze Liste, nicht einer pro Wert.
            restart_applied: >-
                Geschrieben. Die beim Containerstart gelesenen Werte liegen bereit, sind
                aber noch nicht in Kraft — starte den Stack einmal neu, und diese
                Installation kommt als die hoch, von der die Sicherung stammt.
            unknown_instance: 'nicht vermerkt'
            written: 'Das schreibt plMail'
            written_applied: 'Geschrieben'
            written_none: 'In dieser Sicherung ist nichts, was plMail schreiben müsste.'
        section:
            database: 'Datenbank'
            env: 'Umgebungsvariablen'
            files: 'Dateien im Secrets-Volume'
            users: 'Personen und alles, was sie eingerichtet haben'
