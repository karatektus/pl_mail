                machen. Fortfahren?
        fact:
            last_full_resync: 'Postfach komplett neu gelistet (%count%×)'
            never: 'nie'
            never_delivered: 'es kam noch nie etwas an'
            never_run: 'kein Lauf aufgezeichnet'
