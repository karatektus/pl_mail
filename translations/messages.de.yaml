            admin_consent_required: >-
                Deine Organisation verlangt, dass ein Administrator plMail
                freigibt, bevor du dieses Konto verbinden kannst. Bitte deinen
                Microsoft-Administrator um die Freigabe.
            app_not_found: >-
                plMail ist in deiner Microsoft-Organisation nicht registriert.
            bad_credentials: >-
                Die Microsoft-Zugangsdaten von plMail sind ungültig oder
                abgelaufen. Das ist ein Problem der Serverkonfiguration und
                nichts, was du selbst beheben kannst.
            blocked_by_policy: >-
                Eine Sicherheitsrichtlinie deiner Organisation hat diese
                Anmeldung blockiert.
            consent_declined: >-
                Verbindung abgebrochen — plMail wurde kein Zugriff gewährt.
            tenant_mismatch: >-
                Dieser Kontotyp kann sich mit der aktuellen Konfiguration nicht
                bei plMail anmelden. Prüfe die Einstellung
                MICROSOFT_OAUTH_TENANT.

