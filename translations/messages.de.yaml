        subheading: Postfächer hinzufügen, bearbeiten, aktivieren oder entfernen.
        sync_limit:
            all: Alles synchronisieren
            newest: 'Neueste %limit%'
            off_hint: >-
                Alle Nachrichten auf dem Server werden synchronisiert. Bei
                großen Postfächern kann die erste Synchronisierung Stunden
                dauern.
            on_hint: >-
                Es werden nur die neuesten %limit% Nachrichten synchronisiert.
                Erhöhe den Wert später, um weiter zurückzugehen; app:reset holt
                alles erneut.
            title: Zu synchronisierende Nachrichten
        type:
