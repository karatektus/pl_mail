demo:
    bar:
        title: Demo
        blurb: Ein Wegwerf-Postfach. Nichts davon ist echt, und was du schreibst, verlässt den Server nicht.
        next: 'Als Nächstes: %subject%'
        receive: Mail empfangen
    flash:
        received: '„%subject%“ ist angekommen.'
        blocked: Ein echtes Postfach zu verbinden ist in der Demo abgeschaltet.
    login:
        blurb: Sieh dich in plMail um — mit einem eigenen Postfach, ohne Anmeldung und ohne Adresse.
        start: Demo starten
        disclaimer: Dein Demo-Postfach wird nach ein paar Stunden automatisch gelöscht.
    privacy:
        account: >-
            Beim Start der Demo wird ein Wegwerf-Konto mit einer zufällig erzeugten
            Adresse angelegt. Du wirst nicht nach Namen, E-Mail-Adresse oder Passwort
            gefragt, und es wird nichts davon gespeichert. Alles, was du dort eingibst —
            Nachrichten, Entwürfe, Kalendereinträge — existiert nur in diesem Konto und
            wird zusammen mit ihm automatisch gelöscht, etwa %ttl% nach dem Anlegen. In
            der Demo geschriebene Mail wird nie versendet: Es besteht keine Verbindung zu
            einem Mailserver.
        account_title: Das Demo-Konto
        complaint: >-
            Außerdem steht dir ein Beschwerderecht bei einer Datenschutz-Aufsichtsbehörde
            zu.
        controller_intro: Verantwortlich für die hier beschriebene Verarbeitung:
        controller_title: Verantwortlicher
        cookie_mercure: hält die Verbindung für Live-Aktualisierungen offen, solange du angemeldet bist.
        cookie_session: hält dich in deinem Demo-Konto angemeldet. Wird beim Schließen des Browsers gelöscht.
        cookie_ui: merkt sich das gewählte Design und die Sprache.
        cookies: >-
            Es werden drei Cookies gesetzt, alle technisch notwendig für den Betrieb.
            Es gibt kein Tracking-, Werbe- oder Analyse-Cookie und deshalb auch kein
            Cookie-Banner.
        cookies_title: Cookies
        host: Der Server wird in unserem Auftrag von %host% betrieben, als Auftragsverarbeiter auf Grundlage eines Auftragsverarbeitungsvertrags.
        logs: >-
            Wie jeder Webserver protokolliert auch dieser jeden Abruf: die IP-Adresse,
            von der er kam, den Zeitpunkt, die angeforderte Seite, die verweisende Seite
            und die Browserkennung. Das ist für den Betrieb und die Absicherung des
            Dienstes erforderlich (Art. 6 Abs. 1 lit. f DSGVO — berechtigtes Interesse).
            Diese Protokolle werden rotiert und nicht zur Profilbildung verwendet.
        logs_title: Server-Logfiles
        rights: >-
            Du hast das Recht auf Auskunft über die zu dir gespeicherten Daten sowie auf
            deren Berichtigung, Löschung oder Einschränkung der Verarbeitung, außerdem
            ein Widerspruchsrecht und ein Recht auf Datenübertragbarkeit. Wende dich
            dafür an die oben genannte Adresse.
        rights_title: Deine Rechte
        third_parties: >-
            Es werden keine Daten an Dritte weitergegeben. Diese Seite lädt keine
            externen Schriftarten, Skripte, Karten oder Analysedienste — ihre Content
            Security Policy erlaubt Verbindungen ausschließlich zu diesem Server.
        third_parties_title: Weitergabe an Dritte
        title: Datenschutzerklärung
    unavailable:
        title: In der Demo nicht verfügbar
        body: >-
            Ein echtes Postfach zu verbinden ist hier abgeschaltet. Diese Demo
            läuft auf einem Server, der dir nicht gehört, und niemand sollte
            dort sein Mail-Passwort eintippen. Alles andere — Themes, Filter,
            Kalender, Mail schreiben — funktioniert wie auf deiner eigenen
            Installation.
        dismiss: Zurück zur Demo
    impressum:
        link: Impressum
        title: Impressum
        heading: Angaben gemäß § 5 TMG
        operator: Betreiber
        contact: Kontakt
        contact_email: 'E-Mail:'
        disclaimer_title: Über diese Demo
        disclaimer: >-
            Dies ist eine Demonstration von plMail. Die gezeigten Postfächer,
            Absender und Nachrichten sind erfunden; nichts davon ist echte
            Korrespondenz. Hier geschriebene Mail verlässt den Server nie, und
            Demo-Konten werden nach einigen Stunden automatisch gelöscht.
        privacy_title: Daten
        privacy: >-
            Ein Demo-Besuch legt ein Wegwerf-Konto ohne persönliche Daten an.
            Was du dort eingibst, wird mit dem Konto gelöscht. Server-Logs
            speichern IP-Adressen aus den üblichen Betriebsgründen und werden
            rotiert.
        source_title: Quellcode
        source: 'plMail ist freie Software unter der AGPL-3.0:'
