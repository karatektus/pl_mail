            embedding_keep_alive: 'Such-Modell geladen lassen für'
            embedding_keep_alive_help: 'Gleiches Format wie oben. Dieses Modell ist klein und wird ständig gebraucht, deshalb kostet -1 — dauerhaft geladen — meist kaum etwas und spart bei jeder Suche eine Wartezeit; wenn der Host den Speicher übrig hat, lohnt es sich. Leer lassen, um das zu nehmen, was am Host selbst eingestellt ist.'
            embedding_model: 'Such-Modell'
            embedding_model_help: 'Wandelt Mail in Vektoren um, damit die Suche Bedeutung statt Wörter findet.'
            search_query_instruction: 'Anweisung für die Suchanfrage'
            search_query_instruction_help: 'Wird vor den Suchtext gesetzt, bevor er in einen Vektor umgewandelt wird. Die meisten Modelle brauchen eine und antworten ohne sie schlecht; für Modelle ohne lässt du das Feld leer. Betrifft nur Suchanfragen — du musst deine Mail dafür nie neu indexieren.'
            semantic_min_similarity: 'Mindest-Ähnlichkeit'
            semantic_min_similarity_help: 'Wie nah ein Treffer sein muss, von 0 bis 1. Jedes Modell hat seine eigene Skala, deshalb gehört der Wert zum Modell darüber: zu hoch findet nichts, zu niedrig liefert das ganze Postfach.'
