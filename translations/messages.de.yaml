            push_expires: 'Registrierung läuft ab'
            push_last_delivered: 'Letzte Benachrichtigung erhalten'
            push_last_renewal: 'Erneuerung lief zuletzt'
        flash:
            calendar_resync: >-
                %calendar% wurde zur Synchronisierung angemeldet. Sie läuft
                jetzt im Hintergrund, und die Karte unten meldet das Ergebnis.
            push_repair_failed: >-
                Die Sofortzustellung für %account% konnte nicht neu registriert
                werden. Sie bleibt beim Abruf nach Zeitplan, deine Post kommt
                also weiter an. Die Karte unten zeigt, was bekannt ist.
            push_repaired: >-
                Sofortzustellung für %account% neu registriert.
            queue_discarded: '%count% liegen gebliebene Aufgaben verworfen.'
            queue_retried: '%count% liegen gebliebene Aufgaben wieder eingereiht.'
        heading: 'Zustand deiner Konten'
        healthy:
            body: >-
                Deine Konten sind angemeldet, deine Kalender synchronisieren,
                und es wartet nichts auf dich. Sollte einmal keine Post mehr
                ankommen, erscheint „Zustand der Konten“ wieder in der
                Einstellungsliste, und hier steht dann, woran es liegt.
            title: 'Alles funktioniert'
        issue:
            account_reconnect:
                body: >-
                    Für dieses Konto kommt keine neue Post mehr an, und mit ihr
                    steht alles still, was daran hängt: die Kalender­synchroni­
                    sierung, Filter, die beim Empfang laufen, und das Senden
                    über diese Adresse. Die bereits geladene Post ist sicher
                    und weiterhin da. Das passiert, wenn ein Passwort geändert
                    oder die Zwei-Faktor-Anmeldung eingeschaltet wurde, oder
                    wenn die Anmeldung beim Anbieter widerrufen wurde.
                title: '%account% muss sich neu anmelden'
            account_scope_missing:
                body: >-
                    Einige Rechte, die plMail beim Verbinden dieses Kontos
                    angefragt hat, wurden nicht erteilt — deshalb funktionieren
                    Teile davon nicht und können es auch nicht. Kalender werden
                    womöglich nicht synchronisiert, und Änderungen, die du hier
                    machst — als gelesen markieren, archivieren, markieren —
                    werden vielleicht auf diesem Bildschirm übernommen, vom
                    Anbieter abgelehnt und beim nächsten Abgleich wieder
                    zurückgesetzt. Verbinde das Konto neu und erlaube alles,
                    wonach du gefragt wirst.
                title: '%account% hat nicht alle Rechte bekommen'
            account_sync_failing:
                body: >-
                    Mehrere Versuche hintereinander sind fehlgeschlagen — für
                    dieses Konto kommt also keine neue Mail an, und alles, was
                    davon abhängt, steht still: Filter, die beim Empfang laufen,
                    und die Ungelesen-Zähler. Die Mail, die schon da ist, bleibt
                    unverändert. Die Anmeldung ist in Ordnung, es liegt also am
                    Mailserver — er lehnt ab oder ist nicht erreichbar. Prüf, ob
                    er läuft und ob sich an Host, Port oder Passwort etwas
                    geändert hat.
                title: '%account% scheitert immer wieder beim Abgleich'
            server_alert:
                body: >-
                    Dein Mailserver hat diese Nachricht für dich geschickt, hier
                    Wort für Wort: „%alert%“. plMail kann nichts daran ändern —
                    ein volles Postfach, ein bald ablaufendes Passwort oder ein
                    Server, der umzieht, lassen sich nur von dir oder deinem
                    Anbieter klären. Sie bleibt hier stehen, bis der Server sie
                    nicht mehr schickt.
                title: '%account% — eine Nachricht von deinem Mailserver'
            calendar_sync_failing:
                body: >-
                    Dieser Kalender übernimmt keine Änderungen mehr und zeigt
                    den Stand von seiner letzten erfolgreichen Synchroni­
                    sierung. Termine, die seither anderswo angelegt oder
                    verschoben wurden, fehlen hier — und deine Änderungen
                    werden nicht nach außen übertragen.
                title: '%calendar% synchronisiert nicht mehr'
            calendars_blocked:
                body: >-
                    Alle aus demselben Grund stehengeblieben — dem Grund in der
                    Karte darüber. Wenn du den behebst, laufen sie wieder,
                    alle zusammen. Sie zeigen, was sie beim letzten
                    funktionierenden Abgleich wussten, und es wurde nichts
                    gelöscht.
                title: '%count% Kalender werden nicht synchronisiert: %calendars%'
            integration_reconnect:
                body: >-
                    Anhänge in %connection% zu speichern und Dateien von dort
                    anzuhängen funktioniert erst wieder nach einer neuen
                    Verbindung. Deine Post ist davon nicht betroffen — es geht
                    nur um die Verbindung zu diesem Dienst. An den dort
                    abgelegten Dateien wurde nichts verändert.
                title: '%connection% muss neu verbunden werden'
            integration_scope_missing:
                body: >-
                    Diese Verbindung funktioniert, aber einige der Rechte, die
                    plMail angefragt hat, wurden nicht erteilt — Teile davon
                    funktionieren deshalb nicht und können es auch nicht.
                    Vielleicht bleibt das Durchsuchen leer, während Speichern
                    klappt, oder umgekehrt. Verbinde sie neu und erlaube alles,
                    wonach du gefragt wirst.
                title: '%connection% hat nicht alle Rechte bekommen'
            push_degraded:
                body: >-
                    Die Registrierung ist aktiv und nicht abgelaufen, aber es
                    ist Post angekommen, die sie nie angekündigt hat — die
                    Benachrichtigungen gehen also zwischen Anbieter und dieser
                    Installation verloren, sie werden nicht etwa gar nicht
                    angefordert. Bei Gmail deutet das auf das Pub/Sub-Abo in
                    der Google Cloud: Prüfe, ob es dein Topic noch an diese
                    Adresse weiterleitet. Deine Post kommt inzwischen weiter
                    über den Abruf nach Zeitplan an, ein paar Minuten später
                    als sie sollte.
                title: 'Sofortzustellung ist für %account% registriert, kommt aber nicht an'
            push_lapsed:
                body: >-
                    Die Registrierung ist abgelaufen und wurde nicht erneuert,
                    es wird also gar nichts mehr zugestellt. Die Erneuerung
                    läuft einmal täglich von selbst; liegt der letzte Lauf
                    unten Tage zurück, steht der Worker für geplante Aufgaben
                    still — dann ist das zu reparieren, nicht dieses Konto.
                    Deine Post kommt weiter über den Abruf nach Zeitplan an,
                    ein paar Minuten später als sie sollte.
                title: 'Sofortzustellung für %account% ist abgelaufen'
            queue_work_abandoned:
                body: >-
                    %count% Hintergrund­aufgaben sind wiederholt gescheitert
                    und wurden beiseitegelegt, damit sie es nicht endlos weiter
                    versuchen. Meist ist das die Folge eines der Probleme
                    darüber und keine eigene Störung — behebe erst dieses und
                    reihe sie danach wieder ein.
                title: '%count% Hintergrund­aufgaben wurden aufgegeben'
        outcome:
            calendar_failed_again: >-
                Es hat wieder nicht geklappt. Was diesmal gemeldet wurde, steht
                unten — die Synchronisierung lief, sie war nur nicht erfolgreich.
            calendar_still_waiting: >-
                Die Synchronisierung wurde gestartet, aber es kam noch nichts
                zurück. Versuch es noch einmal oder lade die Seite neu.
            calendar_synced: 'Synchronisiert. Dieser Kalender ist wieder auf dem neuesten Stand.'
        pending:
            calendar_resync: 'Synchronisierung wird gestartet …'
            push_resubscribe: 'Wird wieder eingeschaltet …'
            queue_discard: 'Wird verworfen …'
            queue_retry: 'Werden zurückgestellt …'
            reconnect: 'Weiterleitung zu %provider% …'
            reconnect_generic: 'Weiterleitung zur Anmeldung …'
        repair:
            calendar_resync:
                label: 'Jetzt synchronisieren'
                promise: >-
                    Fordert diesen Kalender sofort zu einer neuen
                    Synchronisierung auf und setzt ihn zurück auf den normalen
                    Zeitplan. Es wird nichts gelöscht.
            integration_grant:
                label: 'Alle Rechte erteilen'
                promise: >-
                    Bringt dich zurück zu %connection%, um dich neu anzumelden
                    und alles zu erteilen, wonach plMail fragt. Was dort liegt,
                    wird nicht angefasst.
            integration_reconnect:
                label: 'Neu verbinden'
                promise: >-
                    Führt dich zur erneuten Anmeldung und stellt danach die
                    bestehende Verbindung wieder her. Deine Filter und
                    gespeicherten Ablageorte bleiben erhalten.
            push_resubscribe:
                label: 'Sofortzustellung wieder einschalten'
                promise: >-
                    Meldet dieses Konto erneut für die Sofortzustellung an.
                    Deine Post kommt in der Zwischenzeit ohnehin weiter an.
            queue_discard:
                label: 'Verwerfen'
                promise: >-
                    Wirft die liegen gebliebenen Aufgaben weg, ohne sie
                    auszuführen. Das lässt sich nicht rückgängig machen, und
                    was sie nicht erledigt haben, bleibt unerledigt.
            queue_retry:
                label: 'Wieder einreihen'
                promise: >-
                    Versucht die liegen gebliebenen Aufgaben noch einmal.
                    Unbedenklich — was erneut scheitert, landet einfach wieder
                    hier.
            grant_calendar:
                label: 'Alle Rechte erteilen'
                promise: >-
                    Bringt dich zurück zum Anbieter, um dich als %account%
                    anzumelden und alles zu erteilen, wonach plMail fragt. An
                    deiner Mail ändert sich nichts, und es wird nichts neu
                    geladen.
            reconnect:
                label: 'Konto neu verbinden'
                promise: >-
                    Führt dich zur erneuten Anmeldung und hinterlegt die neue
                    Anmeldung an genau diesem Konto. Deine Post, Ordner,
                    Labels, Filter, Kalender und Einstellungen bleiben
                    unverändert — es wird nichts erneut geladen und nichts
                    gelöscht. Du musst dich als %account% anmelden; eine andere
                    Adresse wird abgelehnt und nicht stillschweigend
                    übernommen.
        reconnect:
            done: '%account% ist wieder verbunden. Post und Kalender holen in den nächsten Minuten auf.'
            wrong_account: >-
                Damit hast du dich als %actual% angemeldet, dieses Konto ist
                aber %expected%. Es wurde nichts verändert. Melde dich beim
                Anbieter von %actual% ab und versuche es erneut — die Adresse
                zu tauschen hätte ein fremdes Postfach unter dieses gemischt.
