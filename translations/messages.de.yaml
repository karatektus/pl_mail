onboarding:
    action:
        back: Zurück
        finish: Fertig
        next: Weiter
        skip: Schritt überspringen
        skip_all: Einrichtung überspringen
    done:
        body: >-
            Alles Übersprungene findest du in den Einstellungen, und du kannst die
            Einrichtung jederzeit über das Benutzermenü erneut starten.
        cta: Zu meinen Mails
        heading: Fertig eingerichtet
    aside:
        account:
            body: >-
                plMail braucht die Adressen für Posteingang (IMAP) und Postausgang (SMTP).
                Die stehen meist in der Hilfe deines Anbieters unter "IMAP-Einstellungen".
            heading: Wo finde ich das?
            oauth: >-
                Für Gmail und Outlook nimm stattdessen die Anmelde-Buttons unter
                Einstellungen → Mail-Konten — dort brauchst du keine Serveradressen.
        admin_ai:
            body: 'Die Adresse eines Ollama-Containers in deinem Netz und die Namen zweier Modelle, die dort liegen — eines zum Schreiben, eines für die Suche. Es verlässt nichts dein Netz.'
            heading: 'Was du brauchst'
            skip_body: 'Klick auf Weiter, ohne etwas auszufüllen. plMail ist auch ohne das ein vollständiger Mail-Client, und du kannst später jederzeit unter Administration → KI zurückkommen.'
            skip_heading: 'Kein Interesse?'
        admin_integrations:
            body: Registriere plMail beim Dienst und trage die erhaltenen Zugangsdaten hier ein.
            heading: So richtest du das ein
        admin_mail:
            google:
                heading: Gmail-Anmeldung einrichten
                step1: console.cloud.google.com öffnen und ein Projekt anlegen oder ein bestehendes wählen.
                step2: 'Unter APIs und Dienste → Bibliothek die Gmail API aktivieren.'
                step3: 'Unter OAuth-Zustimmungsbildschirm "Intern" wählen, wenn du Workspace hast, sonst "Extern", und App-Name sowie Support-E-Mail eintragen.'
                step4: 'Unter Anmeldedaten eine OAuth-Client-ID vom Typ "Webanwendung" erstellen.'
                step5: Die untenstehende Redirect-URI bei "Autorisierte Weiterleitungs-URIs" eintragen und speichern.
                step6: Client-ID und Client-Secret in die Felder links kopieren.
            microsoft:
                heading: Microsoft-Anmeldung einrichten
                step1: 'portal.azure.com öffnen und zu Microsoft Entra ID → App-Registrierungen → Neue Registrierung gehen.'
                step2: 'Auswählen, wer sich anmelden darf. "Konten in einem beliebigen Organisationsverzeichnis und persönliche Microsoft-Konten" passt zur Tenant-Voreinstellung "common".'
                step3: 'Als Redirect-URI-Typ "Web" wählen und die Adresse unten eintragen.'
                step4: 'Nach der Registrierung die Anwendungs-ID (Client) in das Feld links kopieren.'
                step5: 'Unter Zertifikate und Geheimnisse ein neues Client-Secret anlegen und dessen Wert — nicht die ID — sofort kopieren; er wird nur einmal angezeigt.'
                step6: 'Unter API-Berechtigungen diese delegierten Microsoft-Graph-Berechtigungen hinzufügen: Mail.ReadWrite, Mail.Send, MailboxSettings.ReadWrite, Calendars.ReadWrite, User.Read und offline_access. Ohne MailboxSettings.ReadWrite oder Calendars.ReadWrite funktioniert die Anmeldung weiterhin — es fehlen dann nur Kategorien und Kalender, und ein bereits ausgestelltes Token wird nicht nachträglich erweitert.'
        profile:
            body: Das sehen Empfänger in der Absenderzeile. Jederzeit änderbar.
            heading: Wo das erscheint
        security:
            body: >-
                Stell dir vor, jemand hat dein E-Mail-Passwort. Der liest nicht nur
                mit — der klickt bei deiner Bank, deinem Domain-Anbieter und deinem
                Cloud-Speicher auf "Passwort vergessen" und fängt die Links dafür
                hier ab.
            body_two: >-
                Ein zweiter Faktor ist ein Code auf deinem Handy, der sich alle 30
                Sekunden ändert. Ein gestohlenes Passwort allein reicht dann nicht
                mehr.
            heading: Warum ausgerechnet dieses Konto
