settings:
    accounts:
        delete: Konto entfernen
        delete_confirm: '%account% entfernen? Dadurch werden alle synchronisierten Nachrichten dieses Kontos endgültig gelöscht. Das lässt sich nicht rückgängig machen.'
        disable: Konto deaktivieren
        edit: Konto bearbeiten
        empty: Noch keine Konten. Füge eines hinzu, um E-Mails zu synchronisieren.
        enable: Konto aktivieren
        heading: E-Mail-Konten
        label_sync:
            off_hint: >-
                Labels bleiben lokal in plMail. Aktiviere dies, um künftige
                Label-Änderungen zu diesem Anbieter zu spiegeln.
            on_hint: >-
                Labels, die du anlegst, umbenennst oder löschst, werden zu
                diesem Anbieter gespiegelt. Bestehende Labels bleiben
                unverändert.
            title: Labels zum Anbieter synchronisieren
        password_help: Leer lassen, um das aktuelle Passwort zu behalten.
        primary: Primär
        push:
            degraded_hint:
                gmail: >-
                    Push ist registriert, aber es kam zuletzt nichts an. Das
                    Pub/Sub-Push-Abonnement in Google Cloud fehlt möglicherweise
                    oder zeigt woanders hin. E-Mails werden weiterhin nach
                    Zeitplan synchronisiert.
                microsoft: >-
                    Das Push-Abonnement ist abgelaufen und es kommt nichts mehr
                    an. Registriere es neu, um die sofortige Zustellung
                    fortzusetzen. E-Mails werden weiterhin nach Zeitplan
                    synchronisiert.
            failed:
                gmail: >-
                    Push konnte nicht aktiviert werden — Google hat die
                    Watch-Registrierung abgelehnt. Prüfe, ob GMAIL_PUBSUB_TOPIC
                    ein vorhandenes Pub/Sub-Thema benennt und ob dieses Thema
                    gmail-api@system.gserviceaccount.com die Rolle
                    „Pub/Sub Publisher“ gewährt. Das Konto wird weiterhin nach
                    Zeitplan synchronisiert.
                microsoft: >-
                    Push konnte nicht aktiviert werden — Microsoft muss diesen
                    Server über HTTPS erreichen. Prüfe deinen Reverse Proxy und
                    APP_PUBLIC_URL. Das Konto wird weiterhin nach Zeitplan
                    synchronisiert.
            health:
                active: Push
                degraded: Push (liefert nicht)
                inactive: Nach Zeitplan
            mode_pull: Nach Zeitplan
            mode_push: Push
            not_configured: >-
                Push ist auf diesem Server nicht verfügbar — dafür werden eine
                öffentliche HTTPS-Adresse und, für Gmail, ein Cloud-Pub/Sub-Topic
                benötigt.
            off_hint: E-Mails werden nach Zeitplan abgerufen. Aktiviere Push für sofortige Zustellung.
            on_hint:
                gmail: Neue E-Mails kommen sofort per Gmail-Push-Benachrichtigung an.
                microsoft: Neue E-Mails kommen sofort per Microsoft-Push-Benachrichtigung an.
            renews: Abonnement wird vor dem %date% erneuert.
            reregister: Push neu registrieren
            title: Sofortige Zustellung
