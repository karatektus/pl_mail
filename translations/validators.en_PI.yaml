# Symfony be translatin' validation messages in the `validators` domain.
account.host_invalid: A host name or IP address only, sailor — no slashes, question marks nor @.
admin.ai.keep_alive_invalid: "Give a spell like 5m, 30m or 4h, a plain count o' seconds, or -1 to keep it aboard for good — leave it empty an' the host's own word stands."
admin.integrations.client_id_missing: Name th' client ID that goes with this secret.
admin.integrations.secret_missing: Enter th' client secret an' all — an ID alone signs nobody aboard.
admin.sso.error.client_id_missing: 'A client ID be needed with th'' issuer an'' th'' secret. All three, or none o'' them.'
admin.sso.error.issuer_missing: 'An issuer be needed with th'' client ID an'' th'' secret. All three, or none o'' them.'
admin.sso.error.issuer_not_https: 'Th'' issuer must begin with https://. plMail trusts th'' fleet by th'' TLS line t'' it.'
admin.sso.error.secret_missing: 'A client secret be needed with th'' issuer an'' th'' client ID. All three, or none o'' them.'
admin.users.password_too_short: "{{ limit }} marks at least — ye be choosin' this one for somebody else."
alias.invalid: That be no proper parrot address, matey.
app_password.name_required: Give the ship's key a name, lest ye forget which lock it opens.
caldav.address_required: Name the address o' yer CalDAV port — without one there be nobody to hail.
caldav.credential_required: Give a ship's key, or tick the box to use the word stowed for a parrot account.
caldav.reuse_account_required: Say which parrot account lends its word — or take the tick off an' type one.
caldav.username_required: Give the name yer CalDAV port knows ye by.
carddav.address_required: Give the address o' yer CardDAV port — plMail has naught to hail without it.
carddav.username_required: Give the name yer CardDAV port knows ye by.
contacts.invalid_email: '"%email%" be no parrot address.'
contacts.name_or_email_required: Give the hand a name or at least one parrot address.
calendar.name_required: Name the almanac, else ye'll not tell it from the rest.
compose.recipient_invalid: "“{{ address }}” be no proper address, matey."
compose.recipient_required: Name at least one soul afore ye cast off.
settings.password.current_required: Say yer current word — 'tis what keeps a passing hand from changing it at yer open desk.
settings.password.current_wrong: That be not yer current word.
settings.password.mismatch: Th' two new words don't match.
settings.password.too_short: Use at least {{ limit }} characters.
setup.install.password_mismatch: Them two secret words don't match, matey.
setup.install.password_too_short: Use {{ limit }} marks at least. There be no gettin' this one back.
user.email_taken: Another soul sails under that address already. One address, one shipmate.
admin.ai.field.base_url_invalid: 'That must begin with http:// or https://.'
profile.avatar_wrong_type: 'Use a PNG, JPEG, GIF or WebP likeness.'
admin.ai.headers.malformed: 'Write each colour on its own line, as Name: value.'
admin.ai.headers.name: "A header's name may hold only letters, digits an' hyphens, an' can't be empty."
admin.ai.headers.value: "A header's value can't be empty, can't hold a line break or other such devilry, an' runs to 4096 marks at most."
admin.ai.headers.reserved: "One o' these plMail flies herself an' ye can't override: Host, Content-Type, Content-Length, Connection an' their kin."
admin.ai.headers.duplicate: 'The same header be listed twice.'
admin.ai.headers.too_many: '%max% extra headers at most.'
