        disclaimer: 你的演示邮箱将在几小时后自动删除。
    privacy:
        account: '启动演示会创建一个使用随机地址的临时账户。系统不会要求你提供姓名、邮箱地址或密码，也不会存储这些信息。你输入的所有内容，包括邮件、草稿和日历日程，仅存在于该账户中，并会在账户创建约 %ttl% 后随账户自动删除。演示中撰写的邮件绝不会发出，因为系统未连接任何邮件服务器。'
        account_title: 演示账户
        complaint: 你也有权向数据保护监管机构提出投诉。
        controller_intro: 本声明所述数据处理的责任方：
