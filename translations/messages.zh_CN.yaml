                scope_warning: 'Google 于 2025 年 3 月收紧了 Photos 读取权限范围。新注册应用通常只能获得 appcreateddata，仅能访问 plMail 自己上传的媒体；浏览现有图库需要 photoslibrary.readonly，Google 会逐案批准。无论哪种情况，都可将附件保存到 Photos；但在此权限范围获批前，浏览时可能显示空图库。'
                step_api: '为项目启用 Photos Library API。'
            ics:
                intro: "日历订阅源无需在此设置。每位用户可在“设置 → 日历 → 订阅地址”中粘贴日历的发布地址，通常以 .ics 结尾。"
                security: "对于已发布的日历，地址相当于密码：任何持有该地址的人都能读取日历。"
            immich:
                intro: 'Immich 使用每位用户的 API 密钥进行验证，因此此处无需注册。'
                no_share_links: 'Immich 无法为单张照片创建公开链接，只能共享相册。因此，超过附件大小限制的照片无法添加为附件。'
                step_base_url: '可选填固定服务器地址，例如 https://photos.example.com。'
                step_enable: 开启上方的“向用户提供此服务”。
                step_key: '每位用户在 Immich 的 Account Settings → API Keys 下生成 API 密钥，然后粘贴到自己的集成设置中。'
            nextcloud:
                intro: 'Nextcloud 使用每位用户的应用密码进行验证，因此此处无需注册。'
                security: 用户应创建应用密码，而非使用登录密码：应用密码可单独撤销，也可配合双重验证使用。
                step_base_url: '可选填固定服务器地址，例如 https://cloud.example.com。'
                step_enable: 开启上方的“向用户提供此服务”。
                step_user: '每位用户在 Nextcloud 的 Settings → Security → Devices & sessions 下创建应用密码，然后粘贴到自己的集成设置中。'
            one_drive:
                intro: 'OneDrive 使用 Microsoft Graph，与 Microsoft 邮件账户使用相同 API，但需要邮件应用注册中未授予的 Files 权限。'
                step_paste: '将应用程序（客户端）ID 和密钥值粘贴到上方字段。'
                step_permissions: '在 API permissions 下添加 Microsoft Graph 委托权限 Files.ReadWrite 和 offline_access。'
                step_redirect: '在 Authentication 下，将上方的重定向 URI 添加为 Web 平台重定向地址。'
                step_register: '打开 Azure 门户，在 Microsoft Entra ID → App registrations 下注册应用。'
                step_secret: '在 Certificates & secrets 下创建客户端密钥，并立即复制其值；该值只显示一次。'
                tenant_note: '个人 Microsoft 账户使用 common 租户；若仅允许自己的组织访问，请使用自己的租户 ID。'
            paperless:
                asynchronous: '保存附件时会将其交给 Paperless 处理进程，几秒后才会归档。plMail 报告的是移交成功，而非文档处理完成，因此测试保存报告完成后，文件稍后才会出现在 Paperless 中；若 Paperless 因重复而拒绝文件，该文件不会出现。'
                intro: 'Paperless-ngx 使用每位用户的 API 令牌进行验证，因此此处无需注册。'
                no_share_links: 'plMail 不会创建 Paperless 共享链接。该服务的共享是一项独立的权限功能，有自己的有效期；公开文档比添加附件影响更大。因此，超过附件大小限制的文档无法添加为附件。'
                step_base_url: '可选填固定服务器地址，例如 https://paperless.example.com。'
                step_enable: 开启上方的“向用户提供此服务”。
                step_token: '每位用户从 Paperless 的 My Profile → API Auth Token 复制 API 令牌，然后粘贴到自己的集成设置中。'
