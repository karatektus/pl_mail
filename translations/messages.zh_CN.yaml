            account_grant_weekly_expiry:
                body: >-
                    邮件仍在正常接收。但此账户上次登录在 %days% 天后被 Google 停止接受，这次登录也已持续大致相同的时间，因此可能在一两天内失效。

                    这是 OAuth 应用的授权同意屏幕仍处于 Testing 状态时 Google 的行为：无论应用如何请求，发出的刷新令牌都会在约一周后过期。重新登录只能再延长一周，无法解决根本问题。请在 Google Cloud 控制台将授权同意屏幕的发布状态改为 In production。发布不等于验证；未验证的应用仍可使用，只会在首次使用时显示警告。

                    如果你的应用并未处于 Testing 状态，请忽略此提示。上次登录可能因其他原因提前结束，未必会再次发生。
                title: '%account% 可能在一两天内需要重新登录'
            account_reconnect_weekly:
                body: >-
                    此账户已停止接收新邮件，依赖它的功能也已停止，包括日历同步、收信时运行的过滤器，以及从此地址发送邮件。已下载的邮件安全保留在此处。

                    此次登录持续了 %days% 天。这是 OAuth 应用的授权同意屏幕仍处于 Testing 状态时 Google 的行为：发出的刷新令牌会在约一周后过期。如果此部署也是这种情况，重新登录可恢复收信，但下周还会再次发生。要解决问题，请在 Google Cloud 控制台将授权同意屏幕的发布状态改为 In production。发布不等于验证；未验证的应用仍可使用，只会在首次使用时显示警告。
