        controller_unset: 未设置。隐私声明必须指明数据控制者，请在公开此实例前完成设置。
        cookie_mercure: 在你登录期间保持实时更新连接。
        cookie_session: 保持你的演示账户登录状态，关闭浏览器时删除。
        cookie_ui: 记住你选择的主题和语言。
        cookies: '本服务设置三个 Cookie，均为运行服务所必需。没有跟踪、广告或分析 Cookie，因此不显示征求同意的横幅。'
        cookies_title: Cookie
        host: '服务器由 %host% 代表我们运营，并依照数据处理协议担任数据处理者。'
        host_unset: 未设置。运营服务器的公司是数据处理者，必须在此指明。
        logs: '与其他 Web 服务器一样，本服务器会记录每个请求的来源 IP 地址、时间、请求页面、来源页面及浏览器的 user-agent 字符串。这些信息是运行服务和防御攻击所必需的（GDPR 第 6 条第 1 款 f 项：合法利益）。日志会轮替保存，不用于建立任何人的个人画像。'
        logs_title: 服务器日志文件
        processing_title: 处理哪些数据，以及处理依据
        rights: 你有权获知我们持有的与你有关的数据，并有权要求更正、删除或限制处理，也有权反对处理和要求数据可携。请通过上述地址联系我们。
        rights_title: 你的权利
        stats: '为了解演示的使用情况，系统会统计每次启动的演示会话。存储内容包括时间，以及截去末尾部分的 IP 地址的带密钥哈希值（IPv4 截去最后一个字节，IPv6 截去最后 80 位），绝不存储地址本身。此哈希值仅能表明两个会话来自同一网络，并会在 %days% 天后删除（GDPR 第 6 条第 1 款 f 项：了解演示使用情况的合法利益）。'
        stats_title: 使用统计
        third_parties: 不会向第三方传递数据。本站不加载外部字体、脚本、地图或分析工具，内容安全策略仅允许连接本服务器。
        third_parties_title: 第三方
        title: 隐私声明
    unavailable:
        title: 演示环境中不可用
        body: 此处不允许连接真实邮箱。演示运行在不受你控制的服务器上，你不应在陌生人运营的服务器中输入邮箱密码。其他功能，包括主题、筛选器、日历和撰写邮件，均与你自行部署时相同。
