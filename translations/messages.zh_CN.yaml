        unset: 未设置。此页面依法必须指明真实运营者，请在公开此实例前通过环境变量完成设置。
        contact: 联系方式
        contact_email: 邮箱：
        disclaimer_title: 关于此演示
        disclaimer: '这是 plMail 的演示环境。显示的邮箱、发件人和邮件均为虚构，并非真实通信。此处撰写的邮件不会离开服务器，演示账户会在几小时后自动删除。'
        privacy_title: 数据
        privacy: '访问演示会创建一个不含个人数据的临时账户。你输入的所有内容都会随账户删除。服务器日志会出于常规运维需要记录 IP 地址，并轮替保存。'
