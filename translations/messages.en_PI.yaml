        awaiting:
            calendar_resync: >-
                Th'' sync be under way. Awaitin'' word back — this card''ll tell
                ye what came of it th'' moment it hears.
        confirm:
            destructive: >-
                This heaves th'' waitin'' work overboard fer good. Naught be
                tried again, an'' naught comes back up. Carry on?
        fact:
            last_full_resync: 'Counted the whole hold again (%count%×)'
            never: 'never'
            never_delivered: 'naught ever came ashore'
            never_run: 'no run in th'' log'
            not_registered: 'not registered'
            push_expires: 'Registration runs out'
            push_last_delivered: 'Last signal heard'
            push_last_renewal: 'Renewal last sailed'
        flash:
            calendar_resync: >-
                %calendar% be signed up fer a sync. She''s runnin'' below decks
                now, and th'' card below will say how she fared.
            push_repair_failed: >-
                Could not sign %account% up fer instant delivery again. She
                stays on th'' bell, so yer post keeps arrivin''. Th'' card below
                shows what be known.
            push_repaired: >-
                Instant delivery signed up again fer %account%.
            queue_discarded: 'Heaved %count% abandoned tasks overboard.'
            queue_retried: 'Put %count% abandoned tasks back in th'' queue.'
        heading: 'State o'' yer crew'
        healthy:
            body: >-
                Yer crew be signed on, yer almanacs be sailin' true, an'
                naught waits on ye. Should th' post ever stop comin' in,
                th' state o' yer crew sails back into yer settin's list, an'
                this page says why.
            title: 'All hands healthy'
        issue:
            account_reconnect:
                body: >-
                    No fresh post be comin'' in fer this one, an'' neither be
                    aught that hangs off it — th'' almanac, th'' sieves that
                    run on arrival, nor sendin'' from this address. Th'' post
                    ye already hauled aboard be safe an'' still here. This
                    happens when a secret word be changed, when th'' two-key
                    lock be thrown, or when th'' harbourmaster tears up yer
                    papers.
                title: '%account% must sign on again'
            account_scope_missing:
                body: >-
                    Some leave plMail asked for when ye signed this account on
                    were never granted, so parts of it cannot work. Almanacs may
                    not sync, and changes ye make here — markin' read, stowin',
                    starrin' — may take on this screen, be refused by the
                    provider, and be undone at the next reckonin'. Sign on again
                    and grant all that ye be asked.
                title: '%account% never got full leave'
            account_sync_failing:
                body: >-
                    Several tries in a row have foundered, so no new post be
                    arrivin' for this account and all that hangs on it stands
                    still. The post already aboard be safe. The sign-on be
                    sound, so 'tis the mail server refusin' or lost at sea —
                    check she be afloat and that naught changed about the host,
                    the port or the password.
                title: "%account% keeps foulin' its reckonin'"
            server_alert:
                body: >-
                    Yer mail server sent this word for ye, repeated here as it
                    came: “%alert%”. plMail can do naught about it — a full hold,
                    a word about to lapse, or a port about to move be yours or
                    yer provider's to settle. It stands here till the server
                    stops sayin' it.
                title: '%account% — word from yer mail server'
            calendar_sync_failing:
                body: >-
                    This almanac has stopped takin'' on changes, so she shows
                    what she knew th'' last time she sailed. Aught added or
                    shifted elsewhere since then be not aboard, an'' yer own
                    changes be not gettin'' out.
                title: '%calendar% has stopped sailin'''
            calendars_blocked:
                body: >-
                    All becalmed for the one reason, which be the card above —
                    mend that and they all sail again. They show what they knew
                    when last they worked, and naught upon them be lost.
                title: '%count% almanacs be becalmed: %calendars%'
            integration_reconnect:
                body: >-
                    Stowin'' cargo at %connection% an'' haulin'' it back will
                    not work till she be joined again. Yer post be untouched —
                    this be only th'' rope t'' that port. Naught stowed there
                    has been disturbed.
                title: '%connection% needs joinin'' again'
            integration_scope_missing:
                body: >-
                    This connection sails, but some leave plMail asked for were
                    never granted, so parts of her cannot work. Browsin' may
                    come back empty while stowin' still works, or t'other way
                    round. Sign on again and grant all that ye be asked.
                title: '%connection% never got full leave'
            push_degraded:
                body: >-
                    Th'' registration still stands an'' has not run out, yet
                    post has come ashore that it never cried out — so th''
                    signals be lost somewhere 'twixt th'' provider an'' this
                    here install, not left unasked fer. Fer Gmail that points
                    at th'' Pub/Sub subscription in Google''s Cloud: see that
                    it still carries yer topic t'' this address. Yer post keeps
                    arrivin'' on th'' bell meanwhile, some minutes later than
                    it ought.
                title: 'Instant delivery be registered but not arrivin'' fer %account%'
            push_lapsed:
                body: >-
                    Th'' registration ran out an'' were never renewed, so naught
                    be pushed at all. Renewal sails once a day on its own; if
                    th'' last run below be days astern, th'' scheduled-task hand
                    has stopped an'' that be what wants mendin'', not this
                    account. Yer post keeps arrivin'' on th'' bell, some minutes
                    later than it ought.
                title: 'Instant delivery ran out fer %account%'
            queue_work_abandoned:
                body: >-
                    %count% below-decks tasks tried, failed again an'' again,
                    an'' were set aside so they''d stop hammerin'' away. Most
                    times this be th'' wake o'' one o'' th'' troubles above
                    rather than a fault o'' its own — mend that first, then put
                    these back in th'' queue.
                title: '%count% below-decks tasks were given up on'
        outcome:
            calendar_failed_again: >-
                She''s gone and failed again. What she hollered this time be
                below — th'' sync ran, it just didn''t hold.
            calendar_still_waiting: >-
                Th'' sync were started, but nary a word has come back. Try again,
                or reload th'' page t'' see where she got to.
            calendar_synced: 'Synced! This here calendar be up t'' date again.'
        pending:
            calendar_resync: 'Startin'' th'' sync…'
            push_resubscribe: 'Switchin'' her back on…'
            queue_discard: 'Castin'' ''em overboard…'
            queue_retry: 'Puttin'' ''em back…'
            reconnect: 'Settin'' course fer %provider%…'
            reconnect_generic: 'Settin'' course fer th'' sign-in…'
        repair:
            calendar_resync:
                label: 'Try sailin'' now'
                promise: >-
                    Bids this almanac sail again straight away, an'' puts her
                    back on th'' usual bell. Naught aboard her be thrown out.
            integration_grant:
                label: 'Grant full leave'
                promise: >-
                    Takes ye back to %connection% to sign on afresh and grant
                    all that be asked. Naught stowed there be touched.
            integration_reconnect:
                label: 'Join again'
                promise: >-
                    Sends ye t'' sign on again, then restores th'' rope ye
                    already had. Yer sieves an'' stowin'' places keep workin''.
            push_resubscribe:
                label: 'Set instant delivery back on'
                promise: >-
                    Signs this one up fer instant delivery again. Yer post
                    keeps arrivin'' either way while it be sorted.
            queue_discard:
                label: 'Heave ''em overboard'
                promise: >-
                    Throws th'' abandoned tasks away without runnin'' them.
                    There be no haulin'' them back, an'' what they left undone
                    stays undone.
            queue_retry:
                label: 'Put ''em back in th'' queue'
                promise: >-
                    Tries th'' abandoned tasks once more. Safe t'' press — any
                    that fail again just wash back up here.
            grant_calendar:
                label: 'Grant full leave'
                promise: >-
                    Takes ye back to sign on as %account% and grant all that be
                    asked. Naught about yer post changes, and no post be hauled
                    again.
            reconnect:
                label: 'Sign this one on again'
                promise: >-
                    Takes ye t'' sign on again, then sets th'' fresh papers on
