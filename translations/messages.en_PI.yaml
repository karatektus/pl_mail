            admin_consent_required: >-
                Yer fleet requires an admiral to approve plMail afore ye can tie
                up this crew member. Ask yer Microsoft admiral for leave.
            app_not_found: >-
                plMail ain't on the roster of yer Microsoft fleet.
            bad_credentials: >-
                plMail's Microsoft papers be forged or expired. That be trouble
                below decks, not somethin' ye can mend.
            blocked_by_policy: >-
                A standin' order in yer fleet blocked this boardin'.
            consent_declined: >-
                Boardin' called off — plMail were granted no leave.
            tenant_mismatch: >-
                That kind o' crew member can't board plMail as she be rigged
                now. Check the MICROSOFT_OAUTH_TENANT settin'.

