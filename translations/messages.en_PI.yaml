    done:
        body: >-
            Whatever ye sailed past be waitin' in the Settings, an' ye can run this
            again from the crew menu whenever the mood takes ye.
        cta: To me parrots
        heading: Yer ship be rigged
    aside:
        account:
            body: >-
                plMail wants the addresses for incomin' (IMAP) an' outgoin' (SMTP) post.
                Yer provider's help charts list 'em under "IMAP settings".
            heading: Where be these writ?
            oauth: >-
                For Gmail an' Outlook, use the sign-aboard buttons under Riggin' → Mailbags
                instead — no addresses needed.
        admin_ai:
            body: "The berth of an Ollama box on yer network, an' the names o' two models it holds — one for writin', one for searchin'. Nowt leaves yer waters."
            heading: 'What ye need'
            skip_body: "Press Next with all of it empty. plMail be a whole mail client without any o' this, an' ye can come back later under Admin -> Oracle."
            skip_heading: 'Not for ye?'
        admin_integrations:
            body: Register yer ship with the port, then paste the keys it hands ye.
            heading: Riggin' this up
        admin_mail:
            google:
                heading: Riggin' Gmail sign-aboard
                step1: Make sail for console.cloud.google.com an' start a project, or take one ye already hold.
                step2: 'Under APIs an'' Services → Library, hoist th'' Gmail API.'
                step3: 'Under OAuth consent screen, pick Internal if ye sail with Workspace, else External, an'' name yer ship.'
                step4: 'Under Credentials, cut an OAuth client ID o'' th'' "Web application" sort.'
                step5: Paste th' return bearing below into its "Authorised redirect URIs", then stow it.
                step6: Copy th' client ID an' secret it shows ye into th' fields to port.
            microsoft:
                heading: Riggin' Microsoft sign-aboard
                step1: 'Make for portal.azure.com an'' steer to Microsoft Entra ID → App registrations → New registration.'
                step2: 'Choose who may come aboard. "Any organizational directory an'' personal Microsoft accounts" matches th'' tenant settin'' o'' "common".'
                step3: 'Set th'' redirect kind to Web an'' paste th'' bearing below into it.'
                step4: 'Once registered, copy th'' Application (client) ID into th'' field to port.'
                step5: 'Under Certificates an'' secrets, cut a new client secret an'' copy its Value — not its ID — at once; it be shown but once.'
                step6: 'Under API permissions, add th'' delegated Microsoft Graph rights: Mail.ReadWrite, Mail.Send, MailboxSettings.ReadWrite, Calendars.ReadWrite, User.Read an'' offline_access. Leave out MailboxSettings.ReadWrite or Calendars.ReadWrite an'' crew still board — they just get no categories an'' no calendar, an'' a token already issued be never upgraded later.'
        profile:
            body: This be what them on the other end read in the From line.
            heading: Where this flies
        security:
            body: >-
                Think what befalls ye if some scallywag gets yer secret word. He
                don't just read yer parrots — he calls for a new secret word at yer
                bank, yer harbourmaster an' yer storehouse, an' collects the letters
                as they land.
            body_two: >-
                A second lock be a countersign on yer spyglass that turns over every
                30 seconds. A pinched secret word stops bein' enough.
            heading: Why this prize above all
