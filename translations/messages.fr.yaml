settings:
    ai:
        context:
            heading: 'Ce que l’assistant lit'
            message: 'Le message'
            message_hint: 'L’assistant lit le message auquel vous répondez. C’est ce qu’il a toujours fait.'
            none: 'Rien'
            none_hint: 'L’assistant ne voit que ce que vous avez tapé. Le plus rapide, et « Rédiger une réponse » dans une fenêtre vide n’a rien sur quoi s’appuyer — il dira qu’il n’a pas pu répondre. Raccourcir, rendre formel et relire ne sont pas concernés.'
            subheading: 'Plus de conversation donne une meilleure réponse et une attente plus longue. Le modèle tourne sur cette machine : ce que cela coûte, c’est du temps, guère plus.'
            thread: 'La conversation'
            thread_hint: 'L’assistant lit toute la conversation, du plus ancien au plus récent, autant qu’il en tient. De meilleures réponses dans les longues conversations, et une attente plus longue.'
        feature:
            admin_off: 'Non activé sur cette installation'
            categorise: 'Trier le courrier dans les onglets'
            categorise_hint: 'Laisse le modèle départager quand les règles ordinaires ne savent pas où placer un message. Désactivé, ces messages restent là où les règles les ont mis.'
            search: 'Recherche par le sens'
            search_hint: 'Trouve le courrier qui veut dire ce que vous cherchez, pas seulement celui qui l’écrit de la même façon. Désactivé, votre courrier cesse d’être indexé autant que d’être recherché.'
            summary: 'Résumés de conversation'
            summary_hint: 'Résume une longue conversation quand vous le demandez. Rien n’est résumé de lui-même.'
            writing_help: 'Aide-moi à écrire'
            writing_help_hint: 'Rédige une réponse, raccourcit, rend formel, relit — dans la fenêtre de rédaction, quand vous le demandez.'
        features:
            heading: 'Fonctions de l’assistant'
            subheading: "Les fonctions de l’assistant que vous voulez. Votre administrateur décide de ce qui est disponible ; vous décidez de ce que vous utilisez."
        notes:
            about_me_hint: 'Votre métier, à qui vous écrivez d’habitude, tout ce qu’un inconnu devrait savoir pour bien répondre à votre courrier.'
            about_me_label: 'Qui vous êtes'
