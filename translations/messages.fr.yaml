            heading: 'À propos de vous'
            save: 'Enregistrer'
            saved: 'Enregistré.'
            subheading: 'Ce que l’assistant doit savoir avant d’écrire pour vous. Les deux notes sont envoyées avec chaque brouillon, et ne servent à rien d’autre.'
            system_prompt_hint: "Des préférences, pas des instructions — les règles de l’application passent d’abord, y compris écrire dans la langue du mail. Restez bref : de longues notes détournent l’attention du modèle du message lui-même."
