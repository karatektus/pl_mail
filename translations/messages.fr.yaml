            categorisation: 'Trier le courrier dans les onglets'
            categorisation_help: 'S’exécute sur chaque message qui arrive. Ne sert jamais qu’à départager — les règles ordinaires décident d’abord.'
            chat_keep_alive: 'Garder le modèle de rédaction chargé pendant'
            chat_keep_alive_help: '5m, 30m, 4h, ou un nombre de secondes. -1 le garde chargé en permanence, 0 le décharge après chaque requête. Plus c’est long, plus la première réponse arrive vite ; l’hôte garde la mémoire réservée pendant toute la durée dans les deux cas. Laissez vide pour utiliser le réglage de l’hôte.'
            chat_model: 'Modèle de rédaction'
            chat_model_help: 'Utilisé pour les réponses, les résumés et le tri. Un modèle entraîné aux instructions.'
