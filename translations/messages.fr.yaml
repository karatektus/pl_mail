                degraded: Push (ne livre pas)
                inactive: Planifié
                lapsed: Push (expiré)
            not_configured: >-
                Le push n’est pas disponible sur ce serveur — il faut une adresse HTTPS
                publique et, pour Gmail, un sujet Cloud Pub/Sub.
