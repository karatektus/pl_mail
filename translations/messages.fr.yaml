demo:
    bar:
        title: Démo
        blurb: Une boîte jetable. Rien ici n’est réel, et rien de ce que vous envoyez ne quitte le serveur.
        next: 'À suivre : %subject%'
        receive: Recevoir du courrier
    flash:
        blocked: La connexion d’une vraie boîte est désactivée sur la démo.
    login:
        blurb: Découvrez plMail avec une boîte à vous — sans inscription, sans adresse à fournir.
        start: Lancer la démo
        disclaimer: Votre boîte de démo est supprimée automatiquement au bout de quelques heures.
    privacy:
        account: >-
            Lancer la démo crée un compte jetable avec une adresse générée au hasard. On
            ne vous demande ni nom, ni adresse e-mail, ni mot de passe, et aucun n’est
            stocké. Tout ce que vous y saisissez — messages, brouillons, entrées
            d’agenda — n’existe que dans ce compte et est supprimé avec lui,
            automatiquement, environ %ttl% après sa création. Le courrier écrit dans la
            démo n’est jamais envoyé : il n’y a de connexion à aucun serveur de mail.
        account_title: Le compte de démo
        complaint: >-
            Vous avez également le droit d’introduire une réclamation auprès d’une
            autorité de contrôle de la protection des données.
        controller_intro: 'Responsable du traitement décrit ici :'
        controller_title: Responsable du traitement
        controller_unset: 'Non défini. Une politique de confidentialité doit nommer le responsable du traitement — renseignez-le avant de rendre cette instance publique.'
        cookie_mercure: maintient ouverte la connexion de mise à jour en direct pendant que vous êtes connecté.
        cookie_session: vous garde connecté à votre compte de démo. Supprimé à la fermeture du navigateur.
        cookie_ui: retient le thème et la langue que vous avez choisis.
        cookies: >-
            Trois cookies sont déposés, tous strictement nécessaires au fonctionnement du
            service. Il n’y a aucun cookie de pistage, de publicité ou de mesure
            d’audience, et donc aucun bandeau de consentement.
        cookies_title: Cookies
        host: Le serveur est exploité pour notre compte par %host%, en tant que sous-traitant au titre d’un accord de traitement des données.
        host_unset: 'Non défini. L’entreprise qui exploite le serveur est un sous-traitant et doit être nommée ici.'
        logs: >-
            Comme tout serveur web, celui-ci enregistre chaque requête : l’adresse IP
            d’origine, l’heure, la page demandée, la page de provenance et la chaîne
            user-agent du navigateur. C’est nécessaire pour faire fonctionner le service
            et le défendre contre les attaques (art. 6, par. 1, point f du RGPD — intérêt
            légitime). Ces journaux font l’objet d’une rotation et ne servent à établir
            le profil de personne.
        logs_title: Journaux du serveur
        processing_title: Ce qui est traité, et sur quelle base
        rights: >-
            Vous avez le droit d’obtenir des informations sur les données vous
            concernant, ainsi que leur rectification, leur effacement ou la limitation
            de leur traitement, de même que le droit de vous opposer au traitement et le
            droit à la portabilité des données. Écrivez à l’adresse ci-dessus.
        rights_title: Vos droits
        stats: >-
            Pour savoir dans quelle mesure la démo est utilisée, chaque session de démo
            démarrée est comptée. Sont stockés l’heure et un hachage à clé de l’adresse
            IP amputée de sa dernière partie (le dernier octet d’une adresse IPv4, les 80
            derniers bits d’une IPv6) — jamais l’adresse elle-même. Le hachage montre
            seulement que deux sessions venaient du même réseau, et il est supprimé après
            %days% jours (art. 6, par. 1, point f du RGPD — intérêt légitime à savoir dans
            quelle mesure la démo est utilisée).
        stats_title: 'Statistiques d’utilisation'
        third_parties: >-
            Aucune donnée n’est transmise à des tiers. Ce site ne charge ni polices, ni
            scripts, ni cartes, ni outils d’analyse externes — sa politique de sécurité
            du contenu n’autorise de connexion qu’à ce serveur.
        third_parties_title: Tiers
        title: Politique de confidentialité
    unavailable:
        title: Non disponible dans la démo
        body: >-
            La connexion d’une vraie boîte est désactivée ici. Cette démo tourne sur un
            serveur que vous ne contrôlez pas, et aucun inconnu ne devrait y saisir le
            mot de passe de son courrier. Tout le reste — thèmes, filtres, agenda,
            rédaction — fonctionne comme sur votre propre installation.
        dismiss: Retour à la démo
    impressum:
        link: Mentions légales
        title: Mentions légales
        heading: Informations au titre du § 5 TMG
        operator: Éditeur
        unset: 'Non défini. Cette page doit légalement nommer un éditeur réel — renseignez-le dans l’environnement avant de rendre cette instance publique.'
        contact: Contact
        contact_email: 'E-mail :'
        disclaimer_title: À propos de cette démo
        disclaimer: >-
            Ceci est une démonstration de plMail. Les boîtes, expéditeurs et messages
            affichés sont inventés ; aucun n’est une vraie correspondance. Le courrier
            écrit ici ne quitte jamais le serveur, et les comptes de démo sont supprimés
            automatiquement au bout de quelques heures.
        privacy_title: Données
        privacy: >-
            Une visite de démo crée un compte jetable sans aucune donnée personnelle.
            Tout ce que vous y saisissez est supprimé avec le compte. Les journaux du
            serveur enregistrent les adresses IP pour les raisons d’exploitation
            habituelles et font l’objet d’une rotation.
        source_title: Code source
        source: 'plMail est un logiciel libre, sous licence AGPL-3.0 :'
