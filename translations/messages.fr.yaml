            not-a-backup: >-
                Ce n’est pas une sauvegarde de configuration plMail. Rien n’a été modifié.
            unsupported-version: >-
                Cette sauvegarde a été écrite par un plMail plus récent que celui-ci, dans
                un format que cette version ne sait pas lire. Mettez d’abord à jour, puis
                importez-la.
            collision: >-
                Ce fichier décrit quelqu’un dont cette installation possède déjà une partie —
                un mot de passe d’application, un lien de partage ou une page de réservation
                dont le jeton est encore enregistré ici, généralement laissé par un compte
                supprimé. Rien n’a été modifié. Supprimez ces restes, ou importez sur une
                installation qui ne les a pas.
            wrong-password: >-
