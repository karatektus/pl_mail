                label: 'Essayer de synchroniser maintenant'
                promise: >-
                    Demande à cet agenda de se resynchroniser tout de suite, et le
                    remet sur le calendrier normal. Rien n’y est supprimé.
            integration_grant:
                label: 'Accorder un accès complet'
                promise: >-
                    Vous ramène à %connection% pour vous reconnecter et accorder tout
                    ce que plMail demande. Rien de ce qui y est stocké n’est touché.
            integration_reconnect:
                label: 'Reconnecter'
                promise: >-
                    Vous envoie vous reconnecter, puis rétablit la connexion existante.
                    Vos filtres et destinations enregistrées continuent de fonctionner.
            push_resubscribe:
                label: 'Réactiver la livraison instantanée'
                promise: >-
                    Réenregistre ce compte pour la livraison instantanée. Votre
                    courrier continue d’arriver dans tous les cas pendant que cela se
                    règle.
            queue_discard:
                label: 'Les supprimer'
                promise: >-
                    Jette les tâches abandonnées sans les exécuter. Pas d’annulation
                    possible, et ce qu’elles n’avaient pas terminé reste inachevé.
            queue_retry:
                label: 'Les remettre en file'
                promise: >-
                    Réessaie une fois les tâches abandonnées. Sans risque — celles qui
                    échouent encore reviennent simplement ici.
            grant_calendar:
                label: 'Accorder un accès complet'
                promise: >-
                    Vous ramène chez le fournisseur pour vous connecter en tant que
                    %account% et accorder tout ce que plMail demande. Rien ne change
                    dans votre courrier, et aucun courrier n’est téléchargé à nouveau.
            reconnect_early:
                label: 'Se reconnecter maintenant'
                promise: >-
                    Vous fait vous reconnecter avant l’expiration de celle-ci, pour que
                    rien ne s’arrête entre-temps. Votre courrier, vos dossiers,
                    libellés, filtres, agendas et réglages restent exactement tels
                    quels. Vous devez vous connecter en tant que %account%. Cela fait
                    gagner une semaine — cela n’empêche pas que cela se reproduise, ce
                    que fait la publication de l’écran de consentement.
            reconnect:
                label: 'Reconnecter ce compte'
                promise: >-
                    Vous fait vous reconnecter, puis place la nouvelle connexion sur ce
                    même compte. Votre courrier, vos dossiers, libellés, filtres,
                    agendas et réglages restent exactement tels quels — rien n’est
                    téléchargé à nouveau et rien n’est supprimé. Vous devez vous
                    connecter en tant que %account% ; si vous choisissez une autre
                    adresse, elle sera refusée plutôt que substituée.
        reconnect:
            done: '%account% est de nouveau connecté. La synchronisation du courrier et de l’agenda rattrapera son retard dans les prochaines minutes.'
            wrong_account: >-
                Vous vous êtes connecté en tant que %actual%, mais ce compte est
                %expected%. Rien n’a été modifié. Déconnectez-vous de %actual% chez ce
                fournisseur, puis réessayez — substituer l’adresse aurait mélangé une
                autre boîte à celle-ci.
        subheading: >-
            Tout ce qui a cessé de fonctionner, ce que cela signifie pour votre
            courrier, et la plus petite chose qui le répare.
