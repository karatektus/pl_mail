            nomic-embed-text: 'Ce que plMail recommandait auparavant, conservé pour les installations qui l’utilisent déjà. Pris en charge à moitié, honnêtement : il veut que ses documents soient étiquetés comme ses requêtes, ce que plMail ne fait pas, et l’instruction de requête seule ne change rien d’après les mesures.'
            qwen3-embedding_0_6b: 'Le choix par défaut, et celui à prendre sauf raison particulière. Multilingue, ce qui compte plus que n’importe quel benchmark pour une boîte qui n’est pas dans une seule langue, et le seul ici à avoir atteint une précision parfaite aux tests. 639 Mo.'
