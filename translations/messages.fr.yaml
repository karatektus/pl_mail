    address:
        field:
            public_url: Adresse publique
            public_url_help: >-
                L’adresse par laquelle on joint plMail depuis l’extérieur, avec http:// ou
                https:// devant et sans chemin. Gmail et Outlook y renvoient leurs
                notifications push : pour eux, elle doit être joignable depuis internet en https.
        follow_up: >-
            Ce qui est enregistré ailleurs ne suit pas tout seul : les adresses de
            redirection dans les consoles Google et Microsoft, un point de terminaison
            push Gmail Pub/Sub, et l’adresse du serveur dans les applications de mail et
            d’agenda. Les notifications du navigateur doivent être réactivées sur chaque appareil.
        heading: Adresse publique
        in_use: Utilisée actuellement
        intro: >-
            L’adresse à partir de laquelle plMail construit ses propres liens : là où les
            navigateurs se connectent pour les mises à jour en direct, et là où Google et
            Microsoft sont invités à rappeler. Changez-la quand l’installation passe à un
            autre domaine, port ou proxy, ou après la restauration d’une sauvegarde faite
            sur une autre machine.
        none: aucune
        on_file: Enregistrée
        pending: >-
            L’adresse enregistrée n’est pas celle en service. Un changement prend effet au
            prochain démarrage des conteneurs. Si les deux diffèrent encore après un
            redémarrage, APP_PUBLIC_URL est défini dans le fichier compose, et ce réglage
            l’emporte sur celui-ci.
        restart_help: >-
            Redémarrer plMail ici suffit pour les mises à jour en direct. Redémarrez aussi
            toute la stack, pour que les workers enregistrent le push à la nouvelle adresse.
        save: Enregistrer l’adresse
        saved: 'Enregistrée — elle prend effet au prochain redémarrage.'
