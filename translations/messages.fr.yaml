onboarding:
    action:
        back: Retour
        finish: Terminer
        next: Suivant
        skip: Passer cette étape
        skip_all: Passer la configuration
    done:
        body: >-
            Tout ce que vous avez passé se trouve dans les Réglages, et vous pouvez
            relancer ceci depuis le menu utilisateur quand vous voulez.
        cta: Aller à mon courrier
        heading: Tout est prêt
    aside:
        account:
            body: >-
                plMail a besoin des adresses des serveurs entrant (IMAP) et sortant (SMTP)
                de votre fournisseur. Elles se trouvent généralement dans ses pages
                d’aide, sous « Paramètres IMAP ».
            heading: Où les trouver ?
            oauth: >-
                Pour Gmail et Outlook, utilisez plutôt les boutons de connexion dans
                Réglages → Comptes mail — aucune adresse de serveur nécessaire.
        admin_ai:
            body: 'L’adresse d’un conteneur Ollama sur votre réseau, ou de n’importe quel point de terminaison compatible OpenAI, et les noms de deux modèles qu’il propose — un pour la rédaction, un pour la recherche. Le courrier va à cette adresse et nulle part ailleurs.'
            heading: 'Ce qu’il vous faut'
            skip_body: 'Cliquez sur Suivant en laissant tout vide. plMail est un client mail complet sans tout cela, et vous pourrez y revenir plus tard dans Administration → IA.'
            skip_heading: 'Pas intéressé ?'
        admin_integrations:
            body: Enregistrez plMail auprès du service, puis collez les identifiants qu’il vous donne.
            heading: Configuration
        admin_mail:
            google:
                heading: Configurer la connexion Gmail
                step1: Ouvrez console.cloud.google.com et créez un projet, ou choisissez-en un existant.
                step2: 'Sous API et services → Bibliothèque, activez l’API Gmail.'
                step3: 'Sous Écran de consentement OAuth, choisissez Interne si vous avez Workspace, sinon Externe, et renseignez le nom de l’application et l’e-mail d’assistance.'
                step4: 'Sous Identifiants, créez un ID client OAuth de type « Application Web ».'
                step5: Collez l’URI de redirection ci-dessous dans ses « URI de redirection autorisés », puis enregistrez.
                step6: Copiez l’ID client et le secret client affichés dans les champs à gauche.
            microsoft:
                heading: Configurer la connexion Microsoft
                step1: 'Ouvrez portal.azure.com et allez dans Microsoft Entra ID → Inscriptions d’applications → Nouvelle inscription.'
                step2: 'Choisissez qui peut se connecter. « Comptes dans un annuaire d’organisation et comptes Microsoft personnels » correspond au réglage de tenant par défaut « common ».'
                step3: 'Définissez l’URI de redirection sur Web, et collez-y l’adresse ci-dessous.'
                step4: 'Après l’inscription, copiez l’ID d’application (client) dans le champ à gauche.'
                step5: 'Sous Certificats et secrets, créez un nouveau secret client et copiez sa Valeur — pas son ID — tout de suite ; elle n’est affichée qu’une fois.'
                step6: 'Sous Autorisations d’API, ajoutez ces autorisations Microsoft Graph déléguées : Mail.ReadWrite, Mail.Send, MailboxSettings.ReadWrite, Calendars.ReadWrite, User.Read et offline_access. Sans MailboxSettings.ReadWrite ou Calendars.ReadWrite, la connexion fonctionne quand même — mais sans catégories ni agenda, et un jeton déjà émis n’est pas mis à niveau si vous ajoutez l’autorisation plus tard.'
        profile:
            body: C’est ce que voient les destinataires sur la ligne De. Vous pouvez le changer à tout moment.
            heading: Où cela apparaît
        security:
            body: >-
                Pensez à ce qui arrive si quelqu’un obtient le mot de passe de votre
                messagerie. Il ne lit pas seulement votre courrier — il clique sur « mot
                de passe oublié » chez votre banque, votre registraire de domaine, votre
                stockage en ligne, et récupère les liens de réinitialisation à leur
                arrivée.
            body_two: >-
                Un second facteur est un code de votre téléphone qui change toutes les
                30 secondes. Un mot de passe volé ne suffit plus à lui seul.
            heading: Pourquoi c’est le plus important
    account:
