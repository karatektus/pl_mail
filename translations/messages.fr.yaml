toast:
    # After Archive, from a row, the reading pane or the toolbar. The row is
    # gone, which is also what a slip of the pointer looks like — this says
    # which it was, beside an Undo.
    archived: Conversation archivée.
    # After a conversation is dropped on a category tab. The row it names
    # has just disappeared off the list, and the tab it went to may not be
    # on the strip at all — the strip only shows categories holding mail —
    # so this is the only thing on screen saying where it landed.
    categorised: 'Déplacé vers %category%'
    dismiss: Fermer
    # After a conversation is dropped on a folder. Names the folder for the
    # same reason: the row is gone from the list that was open, and a drop
    # is aimed at a small target.
    # After a conversation is dropped on a label rather than a folder. The row
    # stays where it is — the chip beside the subject is the only other sign,
    # and it is most of the way across the screen from where the pointer let go.
    labelled: 'Libellé %label% appliqué'
    moved: 'Déplacé vers %folder%'
    schedule_cancelled: Envoi programmé annulé.
    # Shown when the cancel lost the race to the send. Deliberately blunt: the
    # message has gone and nothing here can bring it back, and the previous
    # behaviour — claiming it was cancelled — was worse than saying nothing.
    send_too_late: Trop tard — ce message avait déjà été envoyé.
    send_failed: 'Ce message n’a pas pu être envoyé : %subject%'
    sent: Message envoyé.
    spam_filtered: 'Déplacé vers Spam. Le courrier futur de %sender% y ira aussi.'
