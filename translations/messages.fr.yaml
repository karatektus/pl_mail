            queue_retried: '%count% tâches abandonnées remises en file.'
        heading: 'Santé des comptes'
        healthy:
            body: >-
                Vos comptes sont connectés, vos agendas se synchronisent et rien ne
                vous attend. Si le courrier cesse un jour d’arriver, Santé des comptes
                revient dans la liste des réglages et cette page en donne la raison.
            title: 'Tout fonctionne'
        issue:
            account_reconnect:
                body: >-
                    Le nouveau courrier n’arrive plus pour ce compte, pas plus que
                    tout ce qui en dépend — synchronisation d’agenda, filtres appliqués
                    à la réception, et envoi depuis cette adresse. Le courrier déjà
                    téléchargé est en sécurité et toujours là. Cela arrive quand un mot
                    de passe est changé, que l’authentification à deux facteurs est
                    activée, ou que la connexion est révoquée depuis la page de sécurité
                    du fournisseur.
                title: '%account% demande que vous vous reconnectiez'
            account_grant_weekly_expiry:
                body: >-
                    Le courrier arrive toujours. Mais la dernière connexion de ce compte
                    a duré %days% jours avant que Google ne l’accepte plus, et celle-ci
                    a maintenant à peu près le même âge — elle cessera donc
                    probablement de fonctionner d’ici un jour ou deux.

                    C’est ce que fait Google à une application OAuth dont l’écran de
                    consentement est encore en Test : les jetons de rafraîchissement
                    qu’elle émet expirent au bout d’environ une semaine, quelle que soit
                    la façon dont l’application les demande. Se reconnecter fait gagner
                    une semaine et ne règle rien. La solution est dans la console Google
                    Cloud — passez le statut de publication de l’écran de consentement
                    en Production. Publier n’est pas la même chose que faire vérifier ;
                    une application non vérifiée fonctionne toujours, elle affiche
                    simplement un écran d’avertissement la première fois.

                    Si vous ne l’avez pas laissée en Test, ignorez ceci — autre chose
                    a mis fin à cette connexion plus tôt, et cela ne se reproduira
                    peut-être pas.
                title: '%account% devra probablement être reconnecté d’ici un jour ou deux'
            account_reconnect_weekly:
                body: >-
                    Le nouveau courrier n’arrive plus pour ce compte, pas plus que
                    tout ce qui en dépend — synchronisation d’agenda, filtres appliqués
                    à la réception, et envoi depuis cette adresse. Le courrier déjà
                    téléchargé est en sécurité et toujours là.

                    Cette connexion a duré %days% jours, ce que fait Google à une
                    application OAuth dont l’écran de consentement est encore en Test :
                    les jetons de rafraîchissement qu’elle émet expirent au bout d’environ
                    une semaine. Si c’est le cas de cette installation, se reconnecter
                    relancera le courrier et la même chose se reproduira la semaine
                    prochaine. Ce qui l’empêche se trouve dans la console Google Cloud —
                    passez le statut de publication de l’écran de consentement en
                    Production. Publier n’est pas la même chose que faire vérifier ;
                    une application non vérifiée fonctionne toujours, elle affiche
                    simplement un écran d’avertissement la première fois.
                title: '%account% demande que vous vous reconnectiez — et le redemandera dans une semaine'
            account_scope_missing:
                body: >-
                    Certaines des autorisations demandées par plMail à la connexion de ce
                    compte n’ont pas été accordées : une partie ne fonctionne donc pas et
                    ne peut pas fonctionner. Les agendas peuvent ne pas se synchroniser,
                    et les changements faits ici — marquer comme lu, archiver, suivre —
                    peuvent s’appliquer à l’écran puis être refusés par le fournisseur,
                    et annulés par la synchronisation suivante. Connectez à nouveau le
                    compte et autorisez tout ce qui vous est demandé.
                title: '%account% n’a pas reçu un accès complet'
            account_sync_failing:
                body: >-
                    Plusieurs tentatives d’affilée ont échoué : le nouveau courrier
                    n’arrive donc pas pour ce compte, et tout ce qui en dépend — filtres
                    appliqués à la réception, compteurs de non-lus — est à l’arrêt. Le
                    courrier déjà là est en sécurité et inchangé. La connexion est
                    bonne, c’est donc le serveur de mail qui refuse ou est injoignable :
                    vérifiez qu’il fonctionne et que rien n’a changé côté serveur, port
                    ou mot de passe.
                title: '%account% n’arrive plus à se synchroniser'
            server_alert:
                body: >-
                    Votre serveur de mail vous a envoyé ce message, reproduit ici mot
                    pour mot : « %alert% ». plMail ne peut rien y faire — une boîte
                    pleine, un mot de passe sur le point d’expirer ou un serveur sur le
                    point de déménager sont des choses que seuls vous ou votre
                    fournisseur pouvez régler. Il reste ici tant que le serveur le répète.
                title: '%account% — un message de votre serveur de mail'
            calendar_sync_failing:
                body: >-
                    Cet agenda ne récupère plus les changements : il affiche ce qu’il
                    savait la dernière fois qu’il a fonctionné. Les événements ajoutés
                    ou déplacés ailleurs depuis ne sont pas encore là, et les changements
                    que vous faites ici ne sont pas envoyés.
                title: '%calendar% ne se synchronise plus'
            calendars_blocked:
                body: >-
                    Tous se sont arrêtés pour la même raison, la carte ci-dessus — la
                    régler les répare ensemble. Ils affichent ce qu’ils savaient la
                    dernière fois qu’ils ont fonctionné, et rien n’y a été supprimé.
                title: '%count% agendas ne se synchronisent pas : %calendars%'
            integration_reconnect:
                body: >-
                    Enregistrer des pièces jointes dans %connection% et y joindre des
                    fichiers ne fonctionnera pas tant qu’il n’est pas reconnecté. Votre
                    courrier n’est pas concerné — c’est seulement le lien vers ce
                    service. Rien de ce qui y est stocké n’a été touché.
                title: '%connection% doit être reconnecté'
            integration_scope_missing:
                body: >-
                    Cette connexion fonctionne, mais certaines des autorisations
                    demandées par plMail n’ont pas été accordées — une partie ne
                    fonctionnera donc pas et ne peut pas fonctionner. La navigation peut
                    revenir vide alors que l’enregistrement réussit, ou l’inverse.
                    Connectez-la à nouveau et autorisez tout ce qui vous est demandé.
                title: '%connection% n’a pas reçu un accès complet'
            push_degraded:
                body: >-
                    L’enregistrement est actif et n’a pas expiré, mais du courrier est
                    arrivé sans jamais avoir été annoncé — les notifications se perdent
                    donc quelque part entre le fournisseur et cette installation, ce
                    n’est pas qu’elles ne sont pas demandées. Pour Gmail, cela désigne
                    l’abonnement Pub/Sub dans Google Cloud : vérifiez qu’il transmet
                    toujours votre sujet à cette adresse. En attendant, votre courrier
                    continue d’arriver via la vérification planifiée, quelques minutes
                    plus tard que prévu.
                title: 'La livraison instantanée est enregistrée mais n’arrive pas pour %account%'
            push_lapsed:
                body: >-
                    L’enregistrement a expiré et n’a pas été renouvelé : plus rien n’est
                    envoyé en push. Le renouvellement se fait tout seul une fois par
                    jour ; si la dernière exécution ci-dessous date de plusieurs jours,
                    le worker des tâches planifiées est arrêté et c’est lui qu’il faut
                    réparer, pas ce compte. Votre courrier continue d’arriver via la
                    vérification planifiée, quelques minutes plus tard que prévu.
                title: 'La livraison instantanée a expiré pour %account%'
            queue_work_abandoned:
                body: >-
                    %count% tâches d’arrière-plan ont essayé, échoué à plusieurs
                    reprises, et ont été mises de côté pour cesser de réessayer. C’est
                    généralement la conséquence d’un des problèmes ci-dessus plutôt
                    qu’une anomalie distincte — réglez-le d’abord, puis remettez-les en
                    file.
                title: '%count% tâches d’arrière-plan ont été abandonnées'
        outcome:
            calendar_failed_again: >-
                Nouvel échec. Ce qu’il a indiqué cette fois figure ci-dessous — la
                synchronisation a tourné, elle n’a simplement pas fonctionné.
            calendar_still_waiting: >-
                La synchronisation a été lancée, mais rien n’est encore revenu.
