            embedding_model: 'Modèle de recherche'
            embedding_own: 'La recherche utilise un autre hôte de modèle'
            embedding_own_help: 'Pour faire tourner le modèle de recherche ailleurs que le modèle de rédaction : un modèle hébergé pour la rédaction et un petit à la maison pour la recherche, ou l’inverse. Chaque message est envoyé une fois à l’hôte de recherche pour être indexé. Si le modèle de recherche porte le même nom là-bas, l’index existant est conservé.'
            embedding_provider: 'Fournisseur de l’hôte de recherche'
            embedding_model_help: 'Transforme le courrier en vecteurs pour que la recherche trouve le sens plutôt que les mots.'
            hold: 'Attendre l’assistant avant d’afficher le nouveau courrier dans un onglet'
            hold_help: 'Pour ceux qui laissent l’assistant trier leur courrier. Le nouveau courrier est tenu hors des onglets le temps dont l’assistant a besoin, pour qu’il apparaisse une seule fois, dans le bon onglet, au lieu d’apparaître dans un onglet puis de passer dans un autre. Le courrier d’un premier import n’est jamais retenu.'
            hold_max_seconds: 'Attendre au plus (secondes)'
            hold_max_seconds_help: 'Au-delà, le courrier est affiché là où les règles ordinaires le placent, quoi que fasse l’assistant — et déplacé si l’assistant répond plus tard. Entre 2 et 300.'
            search_query_instruction: 'Instruction de requête'
            search_query_instruction_help: 'Placée devant le texte recherché avant sa vectorisation. La plupart des modèles en ont besoin et répondent mal sans ; laissez vide pour les modèles qui n’en veulent pas. Seules les recherches sont concernées : la changer n’oblige jamais à réindexer votre courrier.'
            semantic_min_similarity: 'Similarité minimale'
