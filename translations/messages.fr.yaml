                L’enregistrement push a expiré et n’a pas été renouvelé : plus rien
                n’est livré. Le renouvellement se fait tout seul chaque jour — si cela
                se reproduit, le worker des tâches planifiées est arrêté. Le courrier
                est toujours synchronisé selon le calendrier.
            degraded_hint:
                gmail: >-
                    Le push est enregistré mais rien n’est arrivé récemment.
                    L’abonnement push Pub/Sub dans Google Cloud est peut-être absent ou
                    pointe ailleurs. Le courrier est toujours synchronisé selon le
                    calendrier.
                microsoft: >-
                    L’abonnement push a expiré et rien n’arrive. Réenregistrez-le pour
                    retrouver la livraison instantanée. Le courrier est toujours
                    synchronisé selon le calendrier.
            failed:
                gmail: >-
                    Le push n’a pas pu être activé — Google a rejeté l’enregistrement
                    de la surveillance. Vérifiez que GMAIL_PUBSUB_TOPIC désigne un
                    sujet Pub/Sub existant et que ce sujet accorde à
                    gmail-api-push@system.gserviceaccount.com le rôle Éditeur Pub/Sub.
                    Le compte est toujours synchronisé selon le calendrier.
                microsoft: >-
                    Le push n’a pas pu être activé — Microsoft doit pouvoir joindre ce
                    serveur en HTTPS. Vérifiez votre proxy inverse et APP_PUBLIC_URL.
                    Le compte est toujours synchronisé selon le calendrier.
