        disposition:
            applied: 'Écrit, et en vigueur dès maintenant.'
            applied-on-restart: 'prend effet au prochain redémarrage'
            external: >-
                plMail est un client du système auquel ceci appartient, pas son
                propriétaire. Le rôle de base de données a été créé avec le mot de passe
                que Postgres détient déjà, et seul un initdb en lit un nouveau — le changer
                ici seulement donne donc une installation incapable de se connecter à sa
                propre base. Changez-le d’abord dans Postgres, puis ici.
            kept-deliberately: >-
                Conservé tel quel ici, volontairement. Les identifiants de cette
                sauvegarde ont été rechiffrés avec la clé de cette installation au moment
                de leur écriture : mettre en place la clé de la sauvegarde les rendrait
                illisibles — eux et tout ce qui est déjà stocké — au prochain démarrage. La
                ligne ci-dessous ne sert que si vous restaurez aussi l’ancienne base, dont
                les lignes sont chiffrées avec elle ; elle doit alors être en place avant
                que quoi que ce soit ne soit stocké.
            not-writable: >-
                Ce processus n’a pas pu écrire à cet emplacement. Volume de secrets en
                lecture seule, mauvais uid, ou service auquel le volume n’a jamais été
                donné. La valeur est dans la sauvegarde que vous venez d’envoyer — placez-la
                vous-même.
            shadowed-by-compose: >-
                Écrit, mais quelque chose dans l’environnement du processus définit aussi
                ce nom, et le point d’entrée laisse une valeur configurée explicitement
                l’emporter sur celle générée. Supprimez-la ou mettez-la à jour dans votre
                fichier compose — ou dans le `.env` à côté — et redémarrez ; la valeur
                restaurée attend déjà en dessous.
        error:
