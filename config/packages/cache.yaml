framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # The restart-workers signal MUST be shared between containers.
            #
            # php, messenger-worker, scheduler and imap-supervisor all run the
            # same image with no shared volume for var/ (see compose.yaml —
            # only php mounts anything, and that is Caddy's). The default
            # filesystem adapter therefore writes into each container's own
            # layer, so the admin panel would write the signal where nothing
            # else can read it and "Restart workers" would silently do nothing.
            #
            # The database is the one backend every container already shares.
            # Overriding the framework's own pool id (rather than adding our
            # own) is deliberate: Symfony's StopWorkerOnRestartSignalListener
            # reads this exact pool, so this is what makes Messenger workers
            # see the signal at all.
            cache.messenger.restart_workers_signal:
                adapter: cache.adapter.doctrine_dbal
                provider: doctrine.dbal.default_connection

            # "Already logged this" markers, for conditions a remote service
            # repeats far faster than anyone can act on them — a Graph
            # subscription Microsoft still holds and this install does not
            # arrives several times a second, for up to three days.
            #
            # Shared for the same reason as the signal above: any web container
            # can take the notification, and a per-container marker would let
            # each of them log it once over.
            app.notice_throttle:
                adapter: cache.adapter.doctrine_dbal
                provider: doctrine.dbal.default_connection
                default_lifetime: 3600
