doctrine:
    dbal:
        # Not `resolve:`, which the recipe ships. That processor expands
        # %parameter% references inside the value, and a password that needs
        # percent-encoding in a URL is full of things that look like one:
        # `s3cr%26t%2F…` asked the container for a parameter called "26t" and
        # every process died at boot. A generated password is hex and never
        # showed it; a password somebody chose does. Nothing here ever put a
        # parameter in a DSN.
        url: '%env(DATABASE_URL)%'

        # For a DSN that does not say. plMail's own DSNs all carry
        # `serverVersion=18` and that still wins; one written by somebody else
        # — a catalogue's database helper, an operator's own — usually does not,
        # and without a version the bundle cannot pick a platform before it
        # connects: "Invalid platform version "" specified", at boot, in every
        # process. 18 is the server the image is built against (its pg_dump is
        # 18's) and the one every compose file here runs.
        server_version: '18'

        # Tables deliberately written by raw SQL with no entity (see EmbeddingStore
        # and ThreadSummaryStore). Without this every diff asks to drop them. It also
        # hides them from the schema manager's table listing, so nothing that must
        # see every table may read it: DataResetRepository asks the catalogue.
        schema_filter: '~^(?!(ai_backfill_state|ai_call_metric|message_embedding|thread_summary)$)~'

        types:
            # TEXT column, encrypted at rest. See App\Infrastructure\Doctrine\Type\EncryptedStringType.
            encrypted_string: App\Infrastructure\Doctrine\Type\EncryptedStringType

        mapping_types:
            # calendar_event_occurrence.span is a GENERATED tsrange that only
            # raw SQL ever touches, but schema:validate still has to be able to
            # name its type when it reads the database back. DBAL knows tsvector
            # natively (message.search_vector) and does not know tsrange, so say
            # so here. text, matching how DBAL already maps tsvector, so the
            # comparator sees the same type on both sides and stops asking to
            # rewrite the column on every diff.
            tsrange: text


        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            Jmap:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Jmap/State'
                prefix: 'App\Jmap\State'
                alias: Jmap

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
