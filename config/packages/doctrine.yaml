doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        types:
            # TEXT column, encrypted at rest. See App\Infrastructure\Doctrine\Type\EncryptedStringType.
            encrypted_string: App\Infrastructure\Doctrine\Type\EncryptedStringType

        mapping_types:
            # calendar_event_occurrence.span is a GENERATED tsrange that only
            # raw SQL ever touches, but schema:validate still has to be able to
            # name its type when it reads the database back. DBAL knows tsvector
            # natively (message.search_vector) and does not know tsrange, so say
            # so here. text, matching how DBAL already maps tsvector, so the
            # comparator sees the same type on both sides and stops asking to
            # rewrite the column on every diff.
            tsrange: text


        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            Jmap:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Jmap/State'
                prefix: 'App\Jmap\State'
                alias: Jmap

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
