framework:
    rate_limiter:
        # The second factor needs its own throttle. login_throttling on the
        # main firewall covers the password form only — by the time the code
        # form is reachable the password has already been accepted, so an
        # attacker holding a stolen or phished password arrives here with the
        # password limiter already satisfied and six digits between them and
        # the mailbox. 10^6 is not a large number against an unthrottled form.
        #
        # Keyed per user, in App\Security\TwoFactor\TwoFactorThrottle: the
        # thing being guessed is one account's code, and an IP key would let
        # anyone on a shared address lock everyone else out of theirs.
        #
        # Deliberately tighter than the password form. Nobody mistypes a code
        # from an authenticator app five times in a row — and unlike a
        # forgotten password, being locked out here is recoverable from the
        # console without a reset flow.
        two_factor_code:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

        # The public booking POST. It is the only endpoint on this install that
        # an unauthenticated stranger can use to create database rows AND cause
        # an email to be sent, which is the definition of a spam vector: one
        # script against one published booking page would fill a week of the
        # owner's calendar and send a confirmation to a forged address for each.
        #
        # Keyed per IP, in App\Controller\Sharing\BookingController, and that is
        # the opposite of the two_factor_code choice above for the opposite
        # reason. There is no account being attacked here, so there is no
        # per-account key to use — the thing being defended is one owner's
        # diary against whoever is filling it, and the caller's address is the
        # only handle on "whoever". The cost is the one an IP key always has: an
        # office behind one NAT address shares the allowance. Six bookings in an
        # hour is far above what a real group of colleagues does and far below
        # what a script does in a second.
        #
        # A fixed window rather than sliding: the counter is per address on a
        # public endpoint, and the sliding policy keeps a timestamp per hit
        # where this keeps an integer. That matters when the thing being
        # rate-limited is also the thing that can be fired at the cache.
        #
        # NOT applied to the GET. Reading a booking page is what it is for, and
        # a limit there would let one stranger take somebody's published page
        # off the internet by refreshing it.
        booking_attempt:
            policy: 'fixed_window'
            limit: 6
            interval: '1 hour'

        # Provisioning a demo visitor. GET /demo creates a user, an account,
        # ten threads and ten contacts, which is by far the most expensive
        # thing an anonymous caller can ask this install to do — and on a
        # public demo, anonymous callers are the only kind there is. Unlimited,
        # one loop over the URL fills the database with throwaway users faster
        # than app:demo:reap removes them.
        #
        # Keyed per IP, like booking_attempt and for the same reason: there is
        # no account being attacked, so the caller's address is the only handle
        # on "whoever". The cost is the one an IP key always has, and it is the
        # binding constraint here rather than an afterthought: a demo is a link
        # people open together — an office, a conference hall, a classroom —
        # and all of them share one address. Thirty an hour is set for that
        # room, not for one visitor, who needs exactly one (the session
        # survives a reload, so arriving once covers the whole visit). It is
        # still far below what a script does in a second.
        #
        # A fixed window rather than sliding, again for booking_attempt's
        # reason: the counter is per address on a public endpoint, and sliding
        # keeps a timestamp per hit where this keeps an integer.
        demo_provision:
            policy: 'fixed_window'
            limit: 30
            interval: '1 hour'
