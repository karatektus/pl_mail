twig:
    file_name_pattern: '*.twig'
    form_themes:
        - '_layout/form/modal_form_theme.html.twig'
    globals:
        accounts: '@App\Twig\AccountsGlobal'
        sidebarCounts: '@App\Service\Mail\SidebarCounts'
        # Where new mail is sitting, for the "something arrived here" dots.
        # Its own global beside sidebarCounts because new and unread are
        # different questions — see App\Service\Mail\NewMailMarkers.
        newMail: '@App\Service\Mail\NewMailMarkers'
        ruleDescriber: '@App\Service\Rule\FilterDescriber'
        integrations: '@App\Twig\IntegrationsGlobal'
        calendar: '@App\Twig\CalendarGlobal'
        onboarding: '@App\Twig\OnboardingGlobal'
        logAlert: '@App\Twig\LogAlertGlobal'
        # "Something about YOUR accounts needs attention" — the user-facing
        # counterpart to logAlert, which is the admin's. A global for the same
        # reason: the topbar renders from a layout on every authenticated page,
        # so there is no controller in the middle to thread it through.
        accountHealth: '@App\Twig\AccountHealthGlobal'
        # True when the poll is asking for the message list on its own, so the
        # mailbox layout can answer with the frame instead of the whole page.
        listFragment: '@App\Twig\ListFragmentGlobal'
        # Twelve- or twenty-four-hour, as `clock.time`, `clock.timeCompact` and
        # `clock.hour`. A global because the templates that print a time are
        # partials included from layouts, with no one controller behind them.
        clock: '@App\Twig\ClockGlobal'
        # Read by the admin header only, but a global rather than a controller
        # variable because that header renders from a layout every admin
        # section extends — there is no one controller to thread it through.
        app_version: '@App\Service\System\AppVersion'

when@test:
    twig:
        strict_variables: true
