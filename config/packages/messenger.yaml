framework:
    messenger:
        failure_transport: failed

        transports:
            # Three queues, because they answer to different people. A send is a
            # user standing at the screen; a sync is mail that will still be
            # there in a minute; a backfill is nobody waiting at all. On one
            # transport with one worker they were strictly ordered by arrival,
            # so pressing Send behind a Gmail batch meant waiting for the batch
            # — the queue decided by accident what should be decided on purpose.
            #
            # Separate transports are not enough on their own: a worker already
            # inside a long handler cannot pick up a send however it is
            # prioritised. Each of these has its own worker process, which is
            # what actually makes a send independent of a sync. See compose.yaml.

            # Anything leaving plMail, and the only queue a user waits on.
            export:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: export
                # Tighter than the others on purpose. The failures here are a
                # relay refusing a connection or a provider blinking, which
                # clear in seconds, and somebody is watching the outcome. Five
                # attempts still spans about a minute and a half.
                retry_strategy:
                    delay: 2000
                    multiplier: 3
                    max_retries: 5
                    max_delay: 60000

            # Mail coming in, and the work that immediately follows it.
            ingest:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: ingest
                # Everything here talks to a third party, and the failures worth
                # retrying are the ones that take minutes to clear: a rate limit,
                # a mailbox restart. The defaults were 1s/2s/4s — a seven-second
                # window that exhausted every attempt before a rate limit had any
                # chance to end, so a recoverable failure dead-lettered as
                # reliably as an unrecoverable one. This spans about eight and a
                # half minutes, and max_delay keeps the tail inside the worker's
                # --time-limit=3600 so a delayed retry is never left waiting on a
                # restart.
                retry_strategy:
                    delay: 5000
                    multiplier: 3
                    max_retries: 5
                    max_delay: 300000

            # Bulk and deliberate: backfills, rule runs over existing mail,
            # admin sweeps. Slow is fine; blocking the other two is not.
            maintenance:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: maintenance
                retry_strategy:
                    delay: 5000
                    multiplier: 3
                    max_retries: 5
                    max_delay: 300000

            # Kept for one release so envelopes queued before the split still
            # have somewhere to land — the maintenance worker drains it. Nothing
            # routes here any more. Remove once a release has passed.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    delay: 5000
                    multiplier: 3
                    max_retries: 5
                    max_delay: 300000
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Admin "run now" buttons dispatch this; the scheduler dispatches
            # it too, but on its own transport. Routing matters: unrouted, a
            # RunCommandMessage executes synchronously in whatever process
            # dispatched it — for the admin panel that means a maintenance
            # sweep running inside the HTTP request, under the web container's
            # time and memory limits. The tradeoff of routing it here is that a
            # long sweep occupies the async consumer while it runs.
            Symfony\Component\Console\Messenger\RunCommandMessage: maintenance
            Symfony\Component\Mailer\Messenger\SendEmailMessage: export
            Symfony\Component\Notifier\Message\ChatMessage: export
            Symfony\Component\Notifier\Message\SmsMessage: export
            App\Infrastructure\Messaging\Message\SyncImapMailboxMessage: ingest
            App\Infrastructure\Messaging\Message\SyncAccountMessage: ingest
            App\Infrastructure\Messaging\Message\SendMessageMessage: export
            App\Infrastructure\Messaging\Message\ApplyImapFlagsMessage: export
            # Onto export with every other outbound push, and that placement is
            # load-bearing rather than tidy: a purge must not overtake a
            # relabel already queued for the same mail, and one queue is what
            # guarantees the order.
            App\Infrastructure\Messaging\Message\PurgeRemoteMessagesMessage: export
            # Unrouted until now, which meant every Gmail label change — archive,
            # trash, star, mark read, attach a label — made a live Google API
            # call inside the HTTP request the user was waiting on. Its IMAP and
            # Graph counterparts above were always queued, so the same click
            # behaved differently depending on the account it landed on, and a
            # Gmail outage or rate limit surfaced as a 500 on a UI action rather
            # than a retry on the worker.
            App\Infrastructure\Messaging\Message\ApplyGmailLabelsMessage: export
            App\Infrastructure\Messaging\Message\HarvestContactsMessage: maintenance
            App\Infrastructure\Messaging\Message\SyncGmailMessageBatchMessage: ingest
            App\Infrastructure\Messaging\Message\SyncGraphMessageBatchMessage: ingest
            App\Infrastructure\Messaging\Message\ApplyGraphChangesMessage: export
            App\Infrastructure\Messaging\Message\ApplyLabelStructureMessage: export
            App\Infrastructure\Messaging\Message\ApplyMailRuleMessage: maintenance
            App\Infrastructure\Messaging\Message\UploadAttachmentsMessage: export
            App\Infrastructure\Messaging\Message\ExtractEventsMessage: ingest
            # ingest too, and for the same reason — it is mail arriving. It is
            # much slower than its neighbours (a round trip to a model host,
            # seconds on a cold model), but it is also dispatched only when
            # somebody switched the feature on, and it narrows to the mail no
            # rule recognised. A transport of its own would buy isolation from
            # a queue that is empty on almost every installation.
            App\Infrastructure\Messaging\Message\ClassifyMailMessage: ingest
            # ingest as well: it is mail that arrived, only caught up with
            # later, and it is the same shape of work — one round trip per
            # message to a box on the LAN. Nothing dispatches it on arrival any
            # more; the two triggers are a nightly sweep and the warm window
            # after somebody searched (see App\Service\Ai\EmbeddingCatchUp), and
            # both post it in chunks a worker can finish rather than one
            # envelope holding a whole mailbox. Maintenance would be the other
            # candidate and is the wrong one: a batch queued while somebody is
            # sitting at their search results should not be behind an hours-long
            # backfill on the queue built to hold hours-long backfills.
            App\Infrastructure\Messaging\Message\EmbedMessagesMessage: ingest
            # maintenance, NOT ingest. A backfill re-dispatches itself for hours
            # and would otherwise sit in front of every arriving message on the
            # ingest queue — new mail would stop appearing until an old mailbox
            # had finished being catalogued.
            App\Infrastructure\Messaging\Message\BackfillEmbeddingsMessage: maintenance
            # ingest, because it is mail arriving — the delay that makes the
            # reply feel like a reply is a DelayStamp, not this queue's doing.
            # Routing it at all is what matters: unrouted it would run inside
            # the HTTP request that sent the mail, which would deliver the
            # answer before the send had finished rendering.
            App\Infrastructure\Messaging\Message\DemoAutoReplyMessage: ingest
            # Both halves of read receipts, and both routed for the reason
            # RegisterCalendarPushMessage explains: an unrouted message is
            # handled in the process that dispatched it. Unrouted, the send
            # would put an SMTP conversation inside the HTTP request that
            # rendered a mailbox — the exact thing it is async to avoid — and
            # the ingest scan would run inside a sync batch, against the
            # interface contract that says a post-ingest step dispatches and
            # returns.
            #
            # export for the send: it is mail leaving plMail, and it wants that
            # queue's tighter retry ladder, because the failures are a relay
            # refusing a connection. ingest for the scan: it is work that
            # immediately follows mail arriving, and its retries should be the
            # patient ones.
            App\Infrastructure\Messaging\Message\SendReadReceiptMessage: export
            App\Infrastructure\Messaging\Message\ProcessReadReceiptsMessage: ingest
            # ingest rather than export, although a calendar sync writes
            # outward as well as reading. Nobody waits on it: a local edit is
            # saved and on screen before the push is dispatched, so the send
            # queue's promise — "the only queue a user waits on" — would be
            # weakened by a job that can spend minutes doing a full calendar
            # read. The retry strategy here is also the one this needs, since
            # every failure worth retrying is a third-party rate limit that
            # takes minutes to clear.
            App\Infrastructure\Messaging\Message\SyncCalendarMessage: ingest
            # maintenance rather than ingest, although it is dispatched beside
            # the SyncCalendarMessage above and for the same calendar. Two
            # reasons, and the first is the point of the message existing at
            # all: on ingest it would queue behind that first full calendar
            # read, so the channel would open minutes after the subscribe on
            # exactly the large calendars where push matters most, and the
            # feature is here to remove a wait rather than shorten one. The
            # second is that this is the same work `app:calendar:push` does
            # hourly, and that already runs on maintenance as a RunCommand-
            # Message — one queue for registrations means the two cannot
            # contend for a worker with each other or with incoming mail.
            #
            # Routing it at all is load-bearing, not tidiness. Unrouted, a
            # Messenger message is handled in the process that dispatched it,
            # which would put a call to Google or Microsoft inside the HTTP
            # request that ticked the calendar — the one thing this whole path
            # exists to avoid. CalendarSubscriberTest asserts it lands here.
            App\Infrastructure\Messaging\Message\RegisterCalendarPushMessage: maintenance
