framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # Everything on this transport talks to a third party — Gmail,
                # Graph, an IMAP server, an SMTP relay — and the failures worth
                # retrying at all are the ones that take minutes to clear. The
                # defaults here were 1s/2s/4s: a seven-second window that
                # exhausted every attempt before a rate limit or a mailbox
                # restart had any chance to end, so a recoverable failure
                # dead-lettered as reliably as an unrecoverable one. 5s/15s/45s/
                # 135s/300s spans roughly eight and a half minutes instead.
                #
                # max_delay caps the growth at five minutes so the tail stays
                # inside the worker's --time-limit=3600 and a delayed retry is
                # never left waiting on a restart.
                retry_strategy:
                    delay: 5000
                    multiplier: 3
                    max_retries: 5
                    max_delay: 300000
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Admin "run now" buttons dispatch this; the scheduler dispatches
            # it too, but on its own transport. Routing matters: unrouted, a
            # RunCommandMessage executes synchronously in whatever process
            # dispatched it — for the admin panel that means a maintenance
            # sweep running inside the HTTP request, under the web container's
            # time and memory limits. The tradeoff of routing it here is that a
            # long sweep occupies the async consumer while it runs.
            Symfony\Component\Console\Messenger\RunCommandMessage: async
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Infrastructure\Messaging\Message\SyncImapMailboxMessage: async
            App\Infrastructure\Messaging\Message\SyncAccountMessage: async
            App\Infrastructure\Messaging\Message\SendMessageMessage: async
            App\Infrastructure\Messaging\Message\ApplyImapFlagsMessage: async
            # Unrouted until now, which meant every Gmail label change — archive,
            # trash, star, mark read, attach a label — made a live Google API
            # call inside the HTTP request the user was waiting on. Its IMAP and
            # Graph counterparts above were always queued, so the same click
            # behaved differently depending on the account it landed on, and a
            # Gmail outage or rate limit surfaced as a 500 on a UI action rather
            # than a retry on the worker.
            App\Infrastructure\Messaging\Message\ApplyGmailLabelsMessage: async
            App\Infrastructure\Messaging\Message\HarvestContactsMessage: async
            App\Infrastructure\Messaging\Message\SyncGmailMessageBatchMessage: async
            App\Infrastructure\Messaging\Message\SyncGraphMessageBatchMessage: async
            App\Infrastructure\Messaging\Message\ApplyGraphChangesMessage: async
            App\Infrastructure\Messaging\Message\ApplyLabelStructureMessage: async
            App\Infrastructure\Messaging\Message\ApplyMailRuleMessage: async
            App\Infrastructure\Messaging\Message\UploadAttachmentsMessage: async
            App\Infrastructure\Messaging\Message\ExtractEventsMessage: async
