services:
  php:
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - app_var:/app/var
      # Durable mail data must be visible to BOTH the web container (which
      # serves downloads) and the workers (which write during sync). php
      # overlays /app/var with the private app_var volume to keep cache/logs
      # off the bind mount, which otherwise hides these two directories from
      # everything else.
      - app_attachments:/app/var/attachments
      - app_raw:/app/var/raw
      - app_uploads:/app/var/uploads
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/conf.d/20-app.dev.ini:ro
    environment:
      APP_ENV: ${APP_ENV:-dev}
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

  imap-supervisor:
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      # Durable mail data must be visible to BOTH the web container (which
      # serves downloads) and the workers (which write during sync). php
      # overlays /app/var with the private app_var volume to keep cache/logs
      # off the bind mount, which otherwise hides these two directories from
      # everything else.
      - app_attachments:/app/var/attachments
      - app_raw:/app/var/raw
      - app_uploads:/app/var/uploads
    environment:
      APP_ENV: ${APP_ENV:-dev}

  messenger-worker:
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      # Durable mail data must be visible to BOTH the web container (which
      # serves downloads) and the workers (which write during sync). php
      # overlays /app/var with the private app_var volume to keep cache/logs
      # off the bind mount, which otherwise hides these two directories from
      # everything else.
      - app_attachments:/app/var/attachments
      - app_raw:/app/var/raw
      - app_uploads:/app/var/uploads
    environment:
      APP_ENV: ${APP_ENV:-dev}

  database:
    ports:
      - "5432:5432"

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database

  tailwind:
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - .:/app
      - app_var:/app/var
    command: php bin/console tailwind:build --watch
    depends_on:
      - php

  ###> symfony/mercure-bundle ###
  mercure:
    ports:
      - "80"
###< symfony/mercure-bundle ###
volumes:
  app_var:
  app_attachments:
  app_raw:
  app_uploads:
