expose_php = 0
date.timezone = UTC
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; https://symfony.com/doc/current/performance.html#configure-opcache-for-maximum-performance
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256

; https://symfony.com/doc/current/performance.html#don-t-check-php-files-timestamps
opcache.validate_timestamps = 0

; https://symfony.com/doc/current/performance.html#configure-the-php-realpath-cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

memory_limit = 2G

; Compose attachments. PHP defaults (2M/8M) rejected anything past a small
; image before the request ever reached Symfony. Keep post_max_size above
; upload_max_filesize * max_file_uploads is not worth it — one oversized file
; is refused per-file with a message, whereas breaching post_max_size wipes
; $_POST entirely — so give the whole POST comfortable headroom instead.
; ComposeController::MAX_ATTACHMENT_BYTES is the limit users actually meet.
upload_max_filesize = 25M
post_max_size = 60M
