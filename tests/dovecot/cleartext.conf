# The test stack's Dovecot (compose.test.yaml), as the image ships it plus this.
#
# The image refuses LOGIN until the connection is under TLS, with a
# certificate of its own making that no client is meant to trust. The IMAP
# client's tests cover STARTTLS and TLS against it with certificate checks
# off, which is a switch only a test can set. The tests that go through an
# account — the IDLE listener's — open connections the way production does,
# with certificate checks on, so for them the server has to take a login in
# the clear. It is on the test network and nowhere else.
auth_allow_cleartext = yes
