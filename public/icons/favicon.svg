<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" role="img" aria-label="plMail">
    <!--
        The wax seal on its tile, in the seal's own design: LogoMotif::DEFAULT in
        its original paint, drawn the way branding/icon.svg.twig draws a tile.

        Per-user favicons are served by the dynamic branding route. This file is
        the copy for anything that fetches an icon without a page, and it is
        written by hand from the same geometry, so it has to be redrawn when the
        default icon or the seal's original colours change.
    -->
    <defs><clipPath id="tile"><rect x="18" y="18" width="72" height="72" rx="16"/></clipPath></defs>
    <g clip-path="url(#tile)"><rect width="108" height="108" fill="#f3eadb"/><g transform="translate(25.2 25.2) scale(1.2)"><path d="M24.00 4.80 Q29.80 2.36 33.60 7.37 Q39.84 8.16 40.63 14.40 Q45.64 18.20 43.20 24.00 Q45.64 29.80 40.63 33.60 Q39.84 39.84 33.60 40.63 Q29.80 45.64 24.00 43.20 Q18.20 45.64 14.40 40.63 Q8.16 39.84 7.37 33.60 Q2.36 29.80 4.80 24.00 Q2.36 18.20 7.37 14.40 Q8.16 8.16 14.40 7.37 Q18.20 2.36 24.00 4.80 Z" fill="#b3261e" stroke="#b3261e" stroke-width="1.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="15" fill="none" stroke="#8c1d18" stroke-width="1.8"/><g transform="translate(24 24) scale(0.56) translate(-24 -24)"><g transform="translate(-4.5 -0.5)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6.6"><line x1="13" y1="11" x2="13" y2="42" stroke="#fde2d8"/><path d="M13 11 Q13 7 17 7 L23 7 Q29 7 29 13" stroke="#fde2d8"/><line x1="29" y1="13" x2="29" y2="22" stroke="#fde2d8"/><path d="M29 22 Q29 26 23 26 L17 26 Q13 26 13 22" stroke="#fde2d8"/><line x1="37" y1="7" x2="37" y2="26" stroke="#fde2d8"/><line x1="37" y1="26" x2="37" y2="37" stroke="#fde2d8"/><path d="M37 37 Q37 42 42 42 L44 42" stroke="#fde2d8"/></g></g></g></g>
</svg>
