# Optional pgvector database image; keep both -f flags on every command.
# docker compose -f compose.yaml -f compose.pgvector.yaml up -d --wait

x-pgvector-database: &pgvector-database
  image: plmail/postgres-pgvector:${POSTGRES_VERSION:-18}-${PGVECTOR_VERSION:-v0.8.6}
  build:
    context: ./docker/postgres
    args:
      POSTGRES_VERSION: ${POSTGRES_VERSION:-18}
      PGVECTOR_VERSION: ${PGVECTOR_VERSION:-v0.8.6}

services:
  database:
    <<: *pgvector-database
