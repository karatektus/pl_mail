name: Bug
description: Something that worked, or should work, does not.
labels: [bug, needs-triage]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting. A bug fix may go straight to a pull request as long as it describes the bug; this form is for when you would rather somebody else fixed it, or want to check first.
    - type: textarea
      id: what
      attributes:
          label: What happened
          description: What you did, what you expected, and what you saw instead.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: How to make it happen again
          placeholder: |
              1. Open …
              2. Click …
              3. …
    - type: input
      id: version
      attributes:
          label: plMail version
          description: Shown on the Admin page for an administrator, or the image tag you run (`latest`, `main`, `sha-…`, `v0.3.5`).
      validations:
          required: true
    - type: dropdown
      id: provider
      attributes:
          label: Mail provider
          multiple: true
          options: [Gmail, Outlook / Microsoft 365, Other IMAP, Not about mail]
    - type: dropdown
      id: install
      attributes:
          label: Installed with
          options: [TrueNAS app, Docker Compose, Other]
    - type: textarea
      id: logs
      attributes:
          label: Logs or screenshots
          description: Anything from `docker logs` around the time it happened. Remove addresses and tokens you would not want public.
          render: text
