name: Test stack
description: >-
  Everything a job needs before it can run part of plMail's test suite: the
  app image, its PHP dependencies, the compose stack, and optionally a browser.

# WHY THIS IS A COMPOSITE ACTION AND NOT REPEATED YAML
# ────────────────────────────────────────────────────
# The E2E workflow used to be one job that did the setup once and then ran
# everything in sequence. Sharding turned it into six jobs that each need the
# identical eighty lines of preparation, and eighty lines copied six times is
# six places to fix a cache key — the same argument compose.test.yaml makes for
# owning DATABASE_URL rather than having the workflow restate it.
#
# The reasoning for each step is kept here, where the step is, rather than in
# the workflow that calls it.

inputs:
  write-cache:
    description: >-
      Populate the shared layer cache as well as reading it. Exactly one job in
      a run should do this. Six jobs writing the same scope at once is not a
      faster cache, it is six uploads racing to overwrite each other, and the
      one that wins is whichever finished last rather than whichever is most
      complete.
    default: "false"
  stack:
    description: >-
      Install PHP dependencies and bring the compose stack up. False for a job
      that only wants the image built.
    default: "true"
  playwright:
    description: >-
      Install Node and a Chromium. False for the static-analysis job, which
      saves it around a minute and a half of downloading a browser it will
      never open.
    default: "false"

runs:
  using: composite
  steps:
    # Every host path a container is about to write through, created HERE so
    # that the runner user owns it.
    #
    # Docker creates a missing bind-mount source — and any missing parent of it
    # — itself, as root. That is a rule with a long reach, and both halves of it
    # broke this job on its first real run:
    #
    #   ~/.cache/composer is mounted into the composer container below. On a
    #   cache miss nothing had created it, so Docker created ~/.cache as root
    #   too, and `npx playwright install` then died on EACCES trying to mkdir a
    #   SIBLING of it, ~/.cache/ms-playwright. Nothing was wrong with the
    #   composer cache; it was the parent.
    #
    #   var/ and public/assets/ are where compose.test.yaml mounts its named
    #   volumes, so Docker creates them in the checkout as the mount points —
    #   empty, root-owned. `mkdir -p var/log` in the log step then failed, which
    #   is how a green suite would still have lost its artifact.
    #
    # Pre-creating is the whole fix, and it is deliberately preferred to running
    # those containers with `--user $(id -u)`: the image's PHP tooling expects
    # root (COMPOSER_ALLOW_SUPERUSER, the entrypoint's setfacl), and root-owned
    # FILES were never the problem — tar reads mode-644 files it does not own,
    # so the artifact upload and the cache save are both fine. Only creating a
    # directory inside a root-owned one ever failed, and a directory that
    # already exists is never created by Docker.
    #
    # vendor/ is left alone on purpose: containers write it as root and no
    # runner-user step reads or writes it. assets/vendor/ is only READ by one,
    # the cache save below, which is the tar case above.
    - name: Prepare the paths containers write through
      shell: bash
      run: mkdir -p ~/.cache/composer var/log public/assets

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    # Built here rather than by `compose up --build`, for the layer cache alone:
    # the base stage installs a Debian toolchain, the PGDG client and nine PHP
    # extensions, which is minutes of work that has nothing to do with the
    # commit under test. docker.yml caches the prod target this same way.
    #
    # Its own scope. The dev target diverges from prod at the top of the tree —
    # xdebug, a different php.ini — so sharing a scope with docker.yml would
    # have the two evicting each other's layers.
    #
    # `load`, and this exact tag: compose.test.yaml names the image
    # `pl_mail_test-app` explicitly so that it can be built ahead of time. The
    # `up` below then finds it and does not build anything.
    - name: Build the test image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: frankenphp_dev
        tags: pl_mail_test-app
        load: true
        cache-from: type=gha,scope=frankenphp_dev-amd64
        cache-to: ${{ inputs.write-cache == 'true' && 'type=gha,mode=max,scope=frankenphp_dev-amd64' || '' }}

    # The image deliberately carries no vendor/ — the dev target is built for a
    # bind mount, and compose.test.yaml mounts the checkout over /app. So the
    # dependencies have to be installed into the checkout, and this is a cache
    # of the downloads, not of vendor/ itself: `composer install` still runs and
    # still runs its post-install scripts, it just stops fetching the same
    # archives every time.
    - name: Cache Composer downloads
      if: inputs.stack == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/composer
        key: composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-

    # The importmap's packages, which `composer install` fetches from
    # cdn.jsdelivr.net in its post-install scripts (importmap:install) — six
    # jobs, every package, every run. jsDelivr builds a package's `+esm` bundle
    # on request, and now and then one of those requests times out, which
    # failed a whole job before a single test ran. importmap:install fetches
    # only what assets/vendor/ does not already hold at the version
    # importmap.php names, so with this the CDN is asked once per change to
    # the importmap rather than about 270 times per run. A stale restore is
    # harmless for the same reason: what changed is fetched, the rest stays.
    - name: Cache importmap packages
      if: inputs.stack == 'true'
      uses: actions/cache@v6
      with:
        path: assets/vendor
        key: importmap-${{ hashFiles('importmap.php') }}
        restore-keys: importmap-

    # In a container, with the project's own PHP, rather than a setup-php on the
    # runner. That is the whole point of the rework this replaced: there is one
    # PHP in this job and it is the one the app ships with, so a version or
    # extension the image lacks fails here instead of passing here and failing
    # in production.
    #
    # --no-deps because nothing is up yet and none of this needs the database.
    # app-init would do the same install if it found no vendor/ (see
    # compose.test.yaml) — doing it here is only so the cache above can be
    # attached to it.
    - name: Install PHP dependencies
      if: inputs.stack == 'true'
      shell: bash
      # Three tries, for the CDN fetch above when the cache cannot answer:
      # a second `composer install` finds vendor/ in place and only reruns the
      # scripts, so a retry costs seconds. A real dependency problem fails all
      # three and fails the job as before.
      run: |
        for attempt in 1 2 3; do
          docker compose -f compose.test.yaml run --rm --no-deps \
            --volume "$HOME/.cache/composer:/composer-cache" \
            --env COMPOSER_CACHE_DIR=/composer-cache \
            --entrypoint docker-php-entrypoint \
            app composer install --prefer-dist --no-progress --no-interaction && break

          if [ "$attempt" = 3 ]; then
            exit 1
          fi

          echo "::warning::composer install failed (attempt $attempt of 3), usually a CDN fetch in importmap:install; retrying in 15 s"
          sleep 15
        done

    # `npm run test:env:up` without the --build it would otherwise do, because
    # the image is already built and loaded above.
    #
    # --wait blocks on the healthcheck in the Dockerfile, which asks the app's
    # /healthz — not Caddy's admin port — so it goes green only once PHP can
    # reach Postgres. app-init has run migrations, built the assets and seeded
    # both fixture users by then.
    #
    # EACH JOB GETS ITS OWN STACK, and that is what makes sharding possible at
    # all rather than being an incidental consequence of it. The specs that
    # cannot share a worker — the AI settings singleton, the integration
    # provider rows, the Mercure hub one spec restarts — cannot share an
    # INSTALL, which is why they were pinned behind everything else in one
    # worker. Give them a stack of their own and the constraint is gone: there
    # is nothing to collide with.
    #
    # WORKER-BULK IS NAMED EXPLICITLY, and forgetting it is a green suite that
    # goes red on the one spec that matters. `up <service>` starts that service
    # and its DEPENDENCIES; a consumer of a queue the app writes to is a
    # dependent, and compose has no way to know it matters. Left out, a
    # whole-view archive is queued to a real Postgres transport and nothing ever
    # picks it up, so bulk-select-all.spec.ts waits fifteen seconds for rows
    # that will never move. See compose.test.yaml, which explains why this one
    # queue is real here when the other three are in memory.
    - name: Start the test stack
      if: inputs.stack == 'true'
      shell: bash
      run: docker compose -f compose.test.yaml up -d --wait app worker-bulk

    - name: Setup Node
      if: inputs.playwright == 'true'
      uses: actions/setup-node@v7
      with:
        # From .nvmrc rather than pinned here. The two drifted — .nvmrc said 22,
        # this said 20, and the machine the suite was actually developed on ran
        # 24 — so "works locally, fails in CI" had three plausible causes
        # instead of none.
        node-version-file: .nvmrc
        cache: npm

    - name: Install Node dependencies
      if: inputs.playwright == 'true'
      shell: bash
      run: npm ci

    - name: Resolve Playwright version
      if: inputs.playwright == 'true'
      id: playwright-version
      shell: bash
      # The runner image as well, for the system-packages cache below. Read in
      # the shell because ImageOS and ImageVersion are the runner's own
      # environment, which the `env` expression context does not see.
      run: |
        echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    # The browser only. Its system libraries and fonts are the next step's
    # job, on a cache hit and a miss alike — this used to be `--with-deps`
    # here and a bare `install-deps` below, two apt runs with nothing between
    # them and the network.
    - name: Install Playwright browsers
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install chromium

    # THE BROWSER'S SYSTEM PACKAGES, KEPT FROM ONE RUN TO THE NEXT
    # ─────────────────────────────────────────────────────────────
    # `playwright install-deps` apt-installs what Chromium links against and the
    # fonts it renders with, from Ubuntu's mirrors, on every job. On 2026-11-11
    # the hosted runners could not resolve archive, security or
    # azure.archive.ubuntu.com for the better part of an hour, every shard of
    # #570 failed in this step twice, and not one spec ran — on a day GitHub's
    # status page reported Actions as healthy. The libraries were already on the
    # runner image; it was ten font packages that could not be fetched.
    #
    # So the .deb files apt downloaded are kept in the Actions cache and put
    # back into apt's own archive directory before it runs. apt-get uses a .deb
    # it finds there instead of fetching it, and its `update` only warns when
    # the mirrors are unreachable, so with the cache present this step no
    # longer needs the network at all.
    #
    # Through a directory the runner owns rather than caching
    # /var/cache/apt/archives directly: that one is root's, and actions/cache
    # restores as the runner user.
    #
    # Keyed on the runner image as well as the Playwright version. A new image
    # can carry newer package versions, and a .deb for a version apt no longer
    # wants is skipped rather than used; the restore key still brings back the
    # last set, so a new image costs at most the packages that actually changed.
    #
    # Not the alternative of running the specs inside Microsoft's Playwright
    # container, which has all of this baked in: the specs reach into the
    # compose stack with `docker exec` and `docker compose` (E2E_CONSOLE,
    # new-mail-marker.spec.ts), and from inside a container that means
    # mounting the Docker socket and installing a CLI — more moving parts than
    # the problem it solves.
    - name: Restore Playwright's system packages
      if: inputs.playwright == 'true'
      id: playwright-apt
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/playwright-apt
        key: playwright-apt-${{ steps.playwright-version.outputs.image }}-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          playwright-apt-${{ steps.playwright-version.outputs.os }}-

    # Three attempts, a minute apart at most. A mirror that answers again within
    # a couple of minutes — most of what goes wrong with them — then costs a
    # slower job instead of a red one. A longer outage still fails here, after
    # about three minutes, rather than being waited out for the whole job.
    - name: Install Playwright system dependencies
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        mkdir -p ~/.cache/playwright-apt
        if compgen -G ~/.cache/playwright-apt/'*.deb' > /dev/null; then
            sudo cp ~/.cache/playwright-apt/*.deb /var/cache/apt/archives/
        fi

        for attempt in 1 2 3; do
            if npx playwright install-deps chromium; then
                break
            fi

            if [ "$attempt" = 3 ]; then
                exit 1
            fi

            echo "::warning::playwright install-deps failed (attempt $attempt of 3), usually an Ubuntu mirror that cannot be reached; retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
        done

        cp /var/cache/apt/archives/*.deb ~/.cache/playwright-apt/ 2>/dev/null || true

    # Saved only when the exact key missed, so an unchanged set is not
    # uploaded again by every shard of every run.
    - name: Keep Playwright's system packages
      if: inputs.playwright == 'true' && steps.playwright-apt.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/playwright-apt
        key: ${{ steps.playwright-apt.outputs.cache-primary-key }}
