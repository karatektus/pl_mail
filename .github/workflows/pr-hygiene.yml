name: PR hygiene

# Two small checks on every pull request, from CONTRIBUTING.md, "How work gets
# in": label it by the areas it touches, and say so when it links no issue.
#
# pull_request_target rather than pull_request, because most pull requests
# here come from forks, and a fork's run gets a read-only token that cannot
# put a label on anything. That event runs with this repository's token, which
# is safe ONLY because nothing below checks out or runs the pull request's
# code: the labeler reads file names through the API, and the issue check reads
# the pull request's metadata. Do not add a checkout of the head to this file.

on:
    pull_request_target:
        types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
    contents: read
    pull-requests: write
    issues: read

jobs:
    label-areas:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/labeler@v5
              with:
                  # Adds, never removes: an area somebody set by hand stays.
                  sync-labels: false

    linked-issue:
        runs-on: ubuntu-latest
        steps:
            # A WARNING for now, not a failure. A feature is meant to have an
            # accepted issue before it is built, and a bug fix may come without
            # one if it describes the bug; this check cannot tell the two apart,
            # so it says what it sees and leaves the decision to the reviewer.
            # It becomes required for anything that is not a `bug` once
            # contributors have had time to see the new flow.
            - name: Look for an issue the pull request closes
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  count=$(gh api graphql \
                      -f query='query($owner: String!, $name: String!, $number: Int!) {
                          repository(owner: $owner, name: $name) {
                              pullRequest(number: $number) { closingIssuesReferences(first: 1) { totalCount } }
                          }
                      }' \
                      -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$NUMBER" \
                      -q '.data.repository.pullRequest.closingIssuesReferences.totalCount')

                  if [ "$count" = "0" ]; then
                      message="This pull request links no issue. A feature needs an issue labelled 'accepted' first; a bug fix may skip it if the description says what the bug was. Write 'Closes #N' in the description to link one."
                      echo "::warning title=No linked issue::$message"
                      echo "### No linked issue" >> "$GITHUB_STEP_SUMMARY"
                      echo "$message" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "Links $count issue(s)." >> "$GITHUB_STEP_SUMMARY"
                  fi
