name: Build and push Docker image

on:
    # Two things build here, and the cost difference between them lives in the
    # matrix (see the `setup` job), not in this trigger:
    #
    #  - A push to `main` refreshes the `main` tag, which the dev-tip
    #    deployment follows. This builds amd64 ONLY — one job — because that
    #    deployment is amd64 and the arm64 image is a release artifact nobody
    #    pulls from `main`.
    #  - A `v*` tag builds the published release: amd64 + arm64, merged into one
    #    manifest, tagged with the version, `0.0`, and `latest`.
    #
    # Pull requests are deliberately absent: e2e.yml already builds this exact
    # image to run the browser suite against, so a second build here would only
    # prove the Dockerfile compiles twice and push nothing. Use
    # workflow_dispatch to build an untagged commit by hand.
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # The platform matrix is chosen per event, so a `main` push does not pay for
    # the arm64 build every time: a release tag builds both architectures, and
    # anything else (a `main` push, a manual dispatch) builds amd64 alone. This
    # job is a few seconds of shell — cheaper than the arm64 build it saves.
    setup:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.platforms.outputs.matrix }}
        steps:
            - name: Choose platforms for this event
              id: platforms
              shell: bash
              run: |
                  if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                      echo 'matrix={"include":[{"platform":"linux/amd64","arch":"amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
                  else
                      echo 'matrix={"include":[{"platform":"linux/amd64","arch":"amd64","runner":"ubuntu-latest"}]}' >> "$GITHUB_OUTPUT"
                  fi

    # One job per architecture, each on a runner of that architecture. The prod
    # stage runs composer install, dump-autoload, tailwind:build --minify and
    # asset-map:compile — all CPU-bound PHP, which is why this is a matrix of
    # native runners rather than a single job cross-building under QEMU.
    #
    # Neither job pushes a tag. Both push an untagged digest, and `merge` below
    # assembles them into the one manifest list the tags point at — which works
    # for a single digest too, so an amd64-only `main` build still produces a
    # proper manifest for the `main` tag.
    build:
        needs: setup
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Labels only. Tags belong to the manifest list, which does not
            # exist until the merge job runs.
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: frankenphp_prod
                  platforms: ${{ matrix.platform }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Stamped into the image because it cannot be discovered from
                  # inside one: .git is not copied in. The admin panel reads
                  # these back, which is how "which build is this?" gets an
                  # answer when a moving tag and an automatic migration have
                  # both had a go at the deployment.
                  build-args: |
                      APP_VERSION=${{ steps.meta.outputs.version }}
                      APP_COMMIT=${{ github.sha }}
                  provenance: false
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
                  # Scoped per architecture: a shared scope would have the two
                  # jobs evicting each other's layers on every run.
                  cache-from: type=gha,scope=frankenphp_prod-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=frankenphp_prod-${{ matrix.arch }}

            - name: Export digest
              if: github.event_name != 'pull_request'
              run: |
                  digest="${{ steps.build.outputs.digest }}"
                  mkdir -p "${{ runner.temp }}/digests"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"
              shell: bash

            - name: Upload digest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ matrix.arch }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # Collects the per-architecture digests into a single manifest list and
    # applies the tags to it. Pull requests never push, so there is nothing to
    # merge for them.
    merge:
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name != 'pull_request'
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  # `latest` used to follow the default branch, so every push
                  # to main went straight to the tag the README tells people to
                  # pull — including work in progress, and migrations that run
                  # automatically on boot. It now moves only on a release tag.
                  #
                  # `main` still publishes, under its own name, for anyone who
                  # wants the tip.
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

            - name: Inspect image
              run: |
                  docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
