name: Build and push Docker image

on:
    push:
        branches: [main]
        # Releases. `latest` moves only when one of these is pushed — see the
        # tag rules in the merge job.
        tags: ['v*']
        # Not for documentation. A handbook page, a translation or a change to
        # the site tooling cannot alter the image, and rebuilding it for two
        # architectures to publish identical bytes is the most expensive way to
        # do nothing. The wiki and Pages workflows handle those.
        #
        # CHANGELOG.md is deliberately NOT in this list, and that is the whole
        # safety net: a release commit always touches it, so the release path
        # is never filtered out by a rule aimed at prose. If you ever tag a
        # commit that changed only docs, start this workflow by hand.
        paths-ignore:
            - 'docs/**'
            - 'README.md'
            - 'CONTRIBUTING.md'
            - 'CODESTYLE.md'
            - 'bin/build-site.php'
            - 'bin/mirror-wiki.php'
            - 'bin/site/**'
            - '.github/workflows/pages.yml'
            - '.github/workflows/wiki.yml'
    pull_request:
        branches: [main]
    # The escape hatch for the case the note above describes.
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # One job per architecture, each on a runner of that architecture. The prod
    # stage runs composer install, dump-autoload, tailwind:build --minify and
    # asset-map:compile — all CPU-bound PHP, which is why this is a matrix of
    # native runners rather than a single job cross-building under QEMU.
    #
    # Neither job pushes a tag. Both push an untagged digest, and `merge` below
    # assembles them into the one manifest list the tags point at.
    build:
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      arch: amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      arch: arm64
                      runner: ubuntu-24.04-arm
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Labels only. Tags belong to the manifest list, which does not
            # exist until the merge job runs.
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: frankenphp_prod
                  platforms: ${{ matrix.platform }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Stamped into the image because it cannot be discovered from
                  # inside one: .git is not copied in. The admin panel reads
                  # these back, which is how "which build is this?" gets an
                  # answer when a moving tag and an automatic migration have
                  # both had a go at the deployment.
                  build-args: |
                      APP_VERSION=${{ steps.meta.outputs.version }}
                      APP_COMMIT=${{ github.sha }}
                  provenance: false
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
                  # Scoped per architecture: a shared scope would have the two
                  # jobs evicting each other's layers on every run.
                  cache-from: type=gha,scope=frankenphp_prod-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=frankenphp_prod-${{ matrix.arch }}

            - name: Export digest
              if: github.event_name != 'pull_request'
              run: |
                  digest="${{ steps.build.outputs.digest }}"
                  mkdir -p "${{ runner.temp }}/digests"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"
              shell: bash

            - name: Upload digest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ matrix.arch }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # Collects the per-architecture digests into a single manifest list and
    # applies the tags to it. Pull requests never push, so there is nothing to
    # merge for them.
    merge:
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name != 'pull_request'
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  # `latest` used to follow the default branch, so every push
                  # to main went straight to the tag the README tells people to
                  # pull — including work in progress, and migrations that run
                  # automatically on boot. It now moves only on a release tag.
                  #
                  # `main` still publishes, under its own name, for anyone who
                  # wants the tip.
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

            - name: Inspect image
              run: |
                  docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
