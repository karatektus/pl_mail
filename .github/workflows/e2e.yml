name: E2E

# Releases, and anything proposed for one. NOT every push.
#
# This job is the expensive one in the repository — it builds the app's own
# FrankenPHP image, brings up Postgres, a Mercure hub and the app, downloads a
# Chromium, and runs PHPStan, PHPUnit and ~250 browser tests — and running it on
# every commit to a branch nobody is releasing from spends most of the account's
# capacity proving the same thing repeatedly.
#
# The trade, stated so it is a decision rather than a surprise: `main` is no
# longer verified commit by commit. A regression pushed to main is found when a
# release is tagged, which may be several commits later, and the tag is then the
# thing that fails. Run it by hand with `workflow_dispatch` before pushing
# anything you are unsure of — or locally, which is faster than either:
#
#   npm run test:unit:docker && npm run test:e2e:docker
#
# Those two commands are now literally what the job below runs. It used to be a
# different thing wearing the same name: PHP on the runner, dependencies
# installed on the runner, and the suite served by `php -S` behind a router
# script written for the occasion. Everything that server could not do by itself
# had an accommodation here — a php.ini copied into the scan dir with sudo,
# PHP_CLI_SERVER_WORKERS, a restart loop around it because it segfaulted
# mid-suite once — and none of it proved anything about FrankenPHP, which is the
# only server plMail is ever served by. The stack below is the one in
# compose.test.yaml, built from this repository's Dockerfile.
on:
    push:
        tags: ['v*']
    # Kept, and cheap: a pull request is somebody proposing a change, which is
    # exactly when a second opinion from the suite is worth having, and there
    # are few of them.
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    playwright:
        name: Playwright
        runs-on: ubuntu-latest

        # No `env:` block, and no Postgres service container. Both were here to
        # configure an app this workflow was running itself; the stack now
        # carries its own database and its own environment, in compose.test.yaml,
        # where a developer running the suite locally reads the same values. Two
        # copies of DATABASE_URL that had to agree are one.
        #
        # TEST_HTTP_PORT is the single exception, and it is here only to be
        # explicit: it is compose.test.yaml's own default and playwright.config.ts
        # falls back to the same number.
        env:
            TEST_HTTP_PORT: "8001"

        steps:
            - uses: actions/checkout@v4

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            # Built here rather than by `compose up --build`, for the layer
            # cache alone: the base stage installs a Debian toolchain, the PGDG
            # client and nine PHP extensions, which is minutes of work that has
            # nothing to do with the commit under test. docker.yml caches the
            # prod target this same way.
            #
            # Its own scope. The dev target diverges from prod at the top of the
            # tree — xdebug, a different php.ini — so sharing a scope with
            # docker.yml would have the two evicting each other's layers.
            #
            # `load`, and this exact tag: compose.test.yaml names the image
            # `pl_mail_test-app` explicitly so that it can be built ahead of
            # time. The `up` below then finds it and does not build anything.
            - name: Build the test image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: frankenphp_dev
                  tags: pl_mail_test-app
                  load: true
                  cache-from: type=gha,scope=frankenphp_dev-amd64
                  cache-to: type=gha,mode=max,scope=frankenphp_dev-amd64

            # The image deliberately carries no vendor/ — the dev target is
            # built for a bind mount, and compose.test.yaml mounts the checkout
            # over /app. So the dependencies have to be installed into the
            # checkout, and this is a cache of the downloads, not of vendor/
            # itself: `composer install` still runs and still runs its
            # post-install scripts, it just stops fetching the same archives
            # every time.
            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: composer-

            # In a container, with the project's own PHP, rather than a
            # setup-php on the runner. That is the whole point of the rework:
            # there is one PHP in this job and it is the one the app ships with,
            # so a version or extension the image lacks fails here instead of
            # passing here and failing in production.
            #
            # --no-deps because nothing is up yet and none of this needs the
            # database. app-init would do the same install if it found no
            # vendor/ (see compose.test.yaml) — doing it here is only so the
            # cache above can be attached to it.
            - name: Install PHP dependencies
              run: |
                  docker compose -f compose.test.yaml run --rm --no-deps \
                    --volume "$HOME/.cache/composer:/composer-cache" \
                    --env COMPOSER_CACHE_DIR=/composer-cache \
                    --entrypoint docker-php-entrypoint \
                    app composer install --prefer-dist --no-progress --no-interaction

            # `npm run test:env:up` without the --build it would otherwise do,
            # because the image is already built and loaded above.
            #
            # --wait blocks on the healthcheck in the Dockerfile, which asks the
            # app's /healthz — not Caddy's admin port — so it goes green only
            # once PHP can reach Postgres. app-init has run migrations, built the
            # assets and seeded both fixture users by then; there are no
            # separate steps for those here because the stack already does them
            # for every developer.
            - name: Start the test stack
              run: docker compose -f compose.test.yaml up -d --wait app

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  # From .nvmrc rather than pinned here. The two drifted —
                  # .nvmrc said 22, this said 20, and the machine the suite was
                  # actually developed on ran 24 — so "works locally, fails in
                  # CI" had three plausible causes instead of none.
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install Node dependencies
              run: npm ci

            - name: Resolve Playwright version
              id: playwright-version
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            # Browsers came from cache; the apt libs they link against did not.
            - name: Install Playwright system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            # After the stack is up, not before: phpstan-symfony resolves service
            # ids out of the compiled test container, and the kernel boots
            # app-init did while migrating and seeding are what produced it.
            # `--no-deps` because the stack is already running and this only
            # needs to join it.
            - name: Run PHPStan
              run: |
                  docker compose -f compose.test.yaml run --rm --no-deps \
                    --entrypoint docker-php-entrypoint app composer stan

            # Fast and dependency-free, so it runs before the browser suite:
            # a failure here is far quicker to read than a Playwright trace.
            #
            # This is `npm run test:unit:docker`, character for character —
            # which is the point. PHPUnit used to run bare on the runner in this
            # job while every developer ran it in a container, so the two could
            # disagree about anything the image decides: PHP version, extensions,
            # upload limits.
            - name: Run PHPUnit tests
              run: npm run test:unit:docker

            # And this is `npm run test:e2e:docker` minus the `up`, which has
            # already happened. playwright.config.ts needs nothing else: it
            # defaults to 127.0.0.1:$TEST_HTTP_PORT and to a console that goes
            # through `docker compose exec`.
            - name: Run Playwright tests
              run: npx playwright test

            # The web server's own log goes up with the report, and now comes
            # from the containers rather than a redirect. It is kept out of the
            # console because it is ~400 lines per page load, but it is the only
            # place a PHP fatal that never reached the kernel is recorded — a
            # trace cannot show what was never a response.
            #
            # The whole project, not just `app`: when the failure is that the
            # stack never came up, the line explaining why is in app-init's
            # migration output or in Postgres', and neither is anywhere else.
            - name: Collect the stack's log
              if: ${{ !cancelled() }}
              run: |
                  mkdir -p var/log
                  docker compose -f compose.test.yaml logs --no-color --timestamps > var/log/e2e-server.log

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      var/log/e2e-server.log
                  retention-days: 14
